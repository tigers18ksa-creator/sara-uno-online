.prices[g.players[g.you]?.pos]||g.owners[g.players[g.you]?.pos]!==-1||g.players[g.you].cash<g.prices[g.players[g.you].pos];if(hasNewMove&&!finished&&!eliminated){visualPositions=oldPos.slice();$('status').textContent='🎲 النرد يدور... انتظر ظهور النتيجة ثم تحرّك الحجر';}renderBoard(g);if(g.started&&!finished&&!eliminated&&g.dice.length){const stamp=g.id+':'+g.turn+':'+g.dice.join('-')+':'+g.rolled;if(stamp!==lastDice){lastDice=stamp;rollFx(g.dice);if(oldPos&&oldPos.length===g.players.length)animatePawn(g,oldPos)}}});
socket.on('chat',m=>{const p=document.createElement('p');const b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));$('messages').append(p);$('messages').scrollTop=$('messages').scrollHeight});
function renderBoard(g,glowPos=-1){const board=$('board');board.replaceChildren();const positions=[];for(let x=10;x>=0;x--)positions.push([10,x]);for(let y=9;y>=0;y--)positions.push([y,0]);for(let x=1;x<=10;x++)positions.push([0,x]);for(let y=1;y<=9;y++)positions.push([y,10]);positions.forEach(([y,x],i)=>{const d=document.createElement('div');d.className='tile';if(y===0||y===10)d.classList.add('horizontal-edge');const specialClass=({0:'special-start',2:'special-chest',4:'special-tax',5:'special-rail',7:'special-chance',10:'special-jail',12:'special-utility',15:'special-rail',17:'special-chest',20:'special-parking',22:'special-chance',25:'special-rail',28:'special-utility',30:'special-gojail',33:'special-chest',35:'special-rail',37:'special-chance'})[i];if(specialClass)d.classList.add(specialClass);if(i===glowPos)d.classList.add('stepGlow');const owner=g.owners[i];if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){d.classList.add('owned');d.style.setProperty('--owner-color',['#ed4054','#3188ec','#22ad61','#f4bf35'][owner]||'#d6ac5c')}d.style.gridRow=11-y;d.style.gridColumn=x+1;const stripe=document.createElement('div');stripe.className='stripe';stripe.style.background=g.owners[i]===-1?['#873c69','#2d6a7a','#9c783b'][Math.floor(i/14)]:['#e24c5d','#3989e3','#34a76b','#e9bd3d'][g.owners[i]];const title=document.createElement('span');title.className='propertyTitle';title.textContent=g.names[i];const cost=document.createElement('small');cost.textContent=g.prices[i]||'';const tokens=document.createElement('b');tokens.className='tokens';g.players.forEach((p,j)=>{if((visualPositions?visualPositions[j]:p.pos)===i&&!p.bankrupt){const t=document.createElement('span');t.className='pawn pawn-'+j;tokens.append(t)}});d.append(stripe,title,cost,tokens);if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){const tag=document.createElement('strong');tag.className='ownerTag';tag.textContent='♛ '+g.players[owner].name;d.append(tag)}board.append(d)});const center=document.createElement('div');center.className='center';center.innerHTML='<h2 class="monoTitle"><span>M</span><span>O</span><span>N</span><span>O</span><span>P</span><span>O</span><span>L</span><span>Y</span></h2><b>مجلس سارة ♛</b><span id="activeTurnAvatar"></span>';board.append(center);const player=g.players[g.turn];const portrait=center.querySelector('#activeTurnAvatar');if(player&&g.started&&!g.ended){const label=document.createElement('div');label.textContent='دورك الآن';label.style.cssText='font-weight:900;font-size:clamp(13px,3vw,21px);color:#66344d';portrait.append(label);if(player.avatar&&(/^(https?:\/\/|data:image\/)/).test(player.avatar)){const img=document.createElement('img');img.src=player.avatar;img.alt='صورة '+player.name;img.style.cssText='width:clamp(35px,9vw,60px);height:clamp(35px,9vw,60px);object-fit:cover;border-radius:50%;border:2px solid #c99a55;display:block;margin:5px auto';img.onerror=()=>{img.replaceWith(document.createTextNode('👤'))};portrait.append(img)}else{const fallback=document.createElement('span');fallback.textContent=player.name.startsWith('الكمبيوتر')?'🤖':'👤';fallback.style.cssText='font-size:clamp(27px,7vw,45px);display:block';portrait.append(fallback)}const n=document.createElement('div');n.textContent=player.name;n.style.cssText='font-size:clamp(11px,2.5vw,17px);font-weight:900';portrait.append(n)}else portrait.textContent=''}
