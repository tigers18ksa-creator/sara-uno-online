const socket=io('/monopoly'),$=id=>document.getElementById(id);let current=null,lastDice='',lastPosition=-1,audioCtx=null;
function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=kind==='buy'?[520,660,820]:kind==='rent'?[330,250]:[300,420,540];notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=kind==='roll'?'triangle':'sine';osc.frequency.setValueAtTime(hz,now+i*.1);gain.gain.setValueAtTime(.0001,now+i*.1);gain.gain.exponentialRampToValueAtTime(.075,now+i*.1+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.1);osc.stop(now+i*.1+.14)})}catch(e){}}
let diceTimer=null,visualPositions=null,moveTimer=null,moveKey='',previousPositions=null,eventTimer=null,lastEventKey='';function hideEvent(){clearTimeout(eventTimer);$('eventReveal').hidden=true}function showEvent(title,icon,detail){$('eventTitle').textContent=title;$('eventIcon').textContent=icon;$('eventText').textContent=detail||'تم سحب البطاقة';$('eventReveal').hidden=false;clearTimeout(eventTimer);eventTimer=setTimeout(hideEvent,6000)}function jailSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let t=audioCtx.currentTime;[440,330,220,165].forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(hz,t+i*.22);g.gain.setValueAtTime(.0001,t+i*.22);g.gain.exponentialRampToValueAtTime(.09,t+i*.22+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.22+.2);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.22);o.stop(t+i*.22+.21)})}catch(e){}}function landedEvent(g,moved,destination){if([2,17,33,7,22,37].includes(destination)){showEvent([2,17,33].includes(destination)?'صندوق الحظ 🎁':'بطاقة الفرصة ✨',[2,17,33].includes(destination)?'🎁':'🃏',g.log)}else if(destination===10&&(/سجن|اذهب/.test(g.log)||g.players[moved]?.jail)){jailSound();showEvent('🚔 دخلت السجن!','🔒',g.log)}}
function makeDie(value,color){const die=document.createElement('div');die.className='die '+color;const spots={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};for(const n of spots[value]||[]){const p=document.createElement('span');p.className='pip';p.style.gridColumn=(n-1)%3+1;p.style.gridRow=Math.floor((n-1)/3)+1;die.append(p)}return die}
function rollFx(values){if(!Array.isArray(values)||values.length!==2)return;clearTimeout(diceTimer);document.querySelectorAll('.diceFx').forEach(e=>e.remove());sound('roll');const el=document.createElement('div');el.className='diceFx';el.style.animation='none';el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.transition='transform .15s';document.body.append(el);let count=0;const draw=(a,b)=>{el.replaceChildren(makeDie(a,'red'),makeDie(b,'blue'))};draw(1,1);const spin=setInterval(()=>{draw(1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6));el.style.transform='translate(-50%,-50%) rotate('+(count%2?12:-12)+'deg) scale(1.08)';if(++count>=10){clearInterval(spin);draw(values[0],values[1]);el.style.transform='translate(-50%,-50%) rotate(0deg) scale(1)';diceTimer=setTimeout(()=>el.remove(),900)}},95)}
function stepSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),v=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(390,t+.09);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.045,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(v);v.connect(audioCtx.destination);o.start(t);o.stop(t+.13)}catch(e){}}function animatePawn(g,oldPos){clearTimeout(moveTimer);const moved=g.players.findIndex((p,i)=>oldPos[i]!==undefined&&oldPos[i]!==p.pos&&!p.bankrupt);if(moved<0)return;const destination=g.players[moved].pos;const steps=g.dice.reduce((a,b)=>a+b,0);if(steps<1||steps>12)return;const from=oldPos[moved];const goJail=destination===10&&(/سجن|اذهب/.test(g.log));if((from+steps)%40!==destination&&!goJail)return;visualPositions=g.players.map(p=>p.pos);visualPositions[moved]=from;let n=0;const advance=()=>{if(!current||current.id!==g.id){visualPositions=null;return}n++;visualPositions[moved]=(from+n)%40;stepSound();renderBoard(current,visualPositions[moved]);if(n<steps)moveTimer=setTimeout(advance,350);else moveTimer=setTimeout(()=>{if(goJail){visualPositions[moved]=30;renderBoard(current,30);$('status').textContent='🚔 اذهب إلى السجن!';jailSound();moveTimer=setTimeout(()=>{visualPositions[moved]=10;renderBoard(current,10);finishMove()},1000)}else finishMove();function finishMove(){visualPositions=null;renderBoard(current);$('status').textContent=current.log+(current.dice.length?' | 🎲 '+current.dice.join(' + '):'');landedEvent(g,moved,destination);if(/اشترى/.test(g.log))sound('buy');else if(/إيجار/.test(g.log))sound('rent')}},450)};moveTimer=setTimeout(advance,2050)}function roll(){socket.emit('roll')}

function create(){sessionStorage.removeItem('saraMonopolySession');socket.emit('create',{name:name(),avatar:localStorage.getItem('saraMyAvatar')||'',target:Number($('tableSize').value)})}
function shareMonopolyInvite(){if(!current)return;const url=location.origin+'/monopoly.html?join='+encodeURIComponent(current.id);if(navigator.share){navigator.share({title:'انضم إلى طاولة مونوبولي',url}).catch(()=>navigator.clipboard?.writeText(url))}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>alert('تم نسخ رابط الانضمام')).catch(()=>prompt('انسخ الرابط',url))}else prompt('انسخ الرابط',url)}
function join(id,watch){sessionStorage.removeItem('saraMonopolySession');socket.emit('join',{id,name:name(),avatar:localStorage.getItem('saraMyAvatar')||'',watch})}
function leave(){socket.emit('leave');sessionStorage.removeItem('saraMonopolySession');current=null;$('game').hidden=true;$('entry').hidden=false}
function send(e){e.preventDefault();const v=$('message').value.trim();if(v)socket.emit('chat',v);$('message').value=''}
socket.on('connect',()=>{const token=sessionStorage.getItem('saraMonopolySession');if(token)socket.emit('resume',token)});
socket.on('resumeFailed',()=>{sessionStorage.removeItem('saraMonopolySession')});
socket.on('errorMessage',alert);
socket.on('tables',tables=>{const invited=new URLSearchParams(location.search).get('join');const invitedTable=tables.find(t=>t.id===invited&&!t.started&&t.players.length<(t.target||4));$('inviteJoin').hidden=!invitedTable;if(invitedTable){$('inviteText').textContent='طاولة '+invitedTable.id+' — '+invitedTable.players.length+'/'+(invitedTable.target||4)+' لاعبين';$('inviteJoinButton').onclick=()=>join(invitedTable.id,true)}$('tables').replaceChildren();if(!tables.length)$('tables').textContent='لا توجد طاولات حاليًا';tables.forEach(t=>{const d=document.createElement('div');d.className='panel';const label=document.createElement('span');label.textContent='طاولة '+t.id+' — '+t.players.length+'/'+(t.target||4)+' لاعبين — 👁️ '+t.watchers+' ';d.append(label);for(const [title,watch] of [['انضمام',false],['مشاهدة',true]]){const b=document.createElement('button');b.textContent=title;b.disabled=!watch&&(t.started||t.players.length>=(t.target||4));b.onclick=()=>join(t.id,watch);d.append(b)}$('tables').append(d)})});
socket.on('state',g=>{let token=sessionStorage.getItem('saraMonopolySession');if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(24)),v=>v.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('saraMonopolySession',token)}socket.emit('bindSession',token);const oldPos=previousPositions;const nextPos=g.players.map(p=>p.pos);const hasNewMove=!!(g.started&&g.dice.length&&oldPos&&oldPos.length===nextPos.length&&nextPos.some((pos,i)=>pos!==oldPos[i]));previousPositions=nextPos;current=g;$('joinInside').hidden=!(g.you<0&&!g.started&&g.players.length<(g.target||4));$('entry').hidden=true;$('game').hidden=false;$('players').replaceChildren();g.players.forEach((p,i)=>{const d=document.createElement('div');d.className='player '+(g.turn===i?'active':'');const pawn=document.createElement('span');pawn.className='pawn pawn-'+i;d.append(pawn,document.createTextNode(p.name+' — '+p.cash+' 💵'+(p.bankrupt?' (مفلس)':'')));$('players').append(d)});$('status').textContent=(!g.started&&g.players.length<(g.target||4)?'بانتظار '+((g.target||4)-g.players.length)+' لاعبين للبدء. افتح طاولة أخرى أو شارك رابط اللعبة مع الأعضاء.':g.log)+(g.dice.length?' | 🎲 '+g.dice.join(' + '):'');$('watchers').textContent='👁️ المشاهدون: '+g.watchers+' '+g.watcherNames.join('، ');$('bots').hidden=!g.host||g.you<0||g.started||g.players.length===(g.target||4);$('start').hidden=!g.host||g.you<0||g.started||g.players.length!==(g.target||4);const turn=g.started&&!g.ended&&g.you===g.turn;$('roll').disabled=!turn||g.rolled;$('end').disabled=!turn||!g.rolled;$('buy').disabled=!turn||!g.rolled||!g.prices[g.players[g.you]?.pos]||g.owners[g.players[g.you]?.pos]!==-1||g.players[g.you].cash<g.prices[g.players[g.you].pos];if(hasNewMove){visualPositions=oldPos.slice();$('status').textContent='🎲 النرد يدور... انتظر ظهور النتيجة ثم تحرّك الحجر';}renderBoard(g);if(g.started&&g.dice.length){const stamp=g.id+':'+g.turn+':'+g.dice.join('-')+':'+g.rolled;if(stamp!==lastDice){lastDice=stamp;rollFx(g.dice);if(oldPos&&oldPos.length===g.players.length)animatePawn(g,oldPos)}}});
socket.on('chat',m=>{const p=document.createElement('p');const b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));$('messages').append(p);$('messages').scrollTop=$('messages').scrollHeight});
function renderBoard(g,glowPos=-1){const board=$('board');board.replaceChildren();const positions=[];for(let x=10;x>=0;x--)positions.push([10,x]);for(let y=9;y>=0;y--)positions.push([y,0]);for(let x=1;x<=10;x++)positions.push([0,x]);for(let y=1;y<=9;y++)positions.push([y,10]);positions.forEach(([y,x],i)=>{const d=document.createElement('div');d.className='tile';const specialClass=({0:'special-start',2:'special-chest',4:'special-tax',5:'special-rail',7:'special-chance',10:'special-jail',12:'special-utility',15:'special-rail',17:'special-chest',20:'special-parking',22:'special-chance',25:'special-rail',28:'special-utility',30:'special-gojail',33:'special-chest',35:'special-rail',37:'special-chance'})[i];if(specialClass)d.classList.add(specialClass);if(i===glowPos)d.classList.add('stepGlow');const owner=g.owners[i];if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){d.classList.add('owned');d.style.setProperty('--owner-color',['#ed4054','#3188ec','#22ad61','#f4bf35'][owner]||'#d6ac5c')}d.style.gridRow=11-y;d.style.gridColumn=x+1;const stripe=document.createElement('div');stripe.className='stripe';stripe.style.background=g.owners[i]===-1?['#873c69','#2d6a7a','#9c783b'][Math.floor(i/14)]:['#e24c5d','#3989e3','#34a76b','#e9bd3d'][g.owners[i]];const title=document.createElement('span');title.textContent=g.names[i];const cost=document.createElement('small');cost.textContent=g.prices[i]||'';const tokens=document.createElement('b');tokens.className='tokens';g.players.forEach((p,j)=>{if((visualPositions?visualPositions[j]:p.pos)===i&&!p.bankrupt){const t=document.createElement('span');t.className='pawn pawn-'+j;tokens.append(t)}});d.append(stripe,title,cost,tokens);if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){const tag=document.createElement('strong');tag.className='ownerTag';tag.textContent='♛ '+g.players[owner].name;d.append(tag)}board.append(d)});const center=document.createElement('div');center.className='center';center.innerHTML='<h2>MONOPOLY</h2><b>مجلس سارة ♛</b><span id="activeTurnAvatar"></span>';board.append(center);const player=g.players[g.turn];const portrait=center.querySelector('#activeTurnAvatar');if(player&&g.started&&!g.ended){const label=document.createElement('div');label.textContent='دورك الآن';label.style.cssText='font-weight:900;font-size:clamp(13px,3vw,21px);color:#66344d';portrait.append(label);if(player.avatar&&(/^(https?:\/\/|data:image\/)/).test(player.avatar)){const img=document.createElement('img');img.src=player.avatar;img.alt='صورة '+player.name;img.style.cssText='width:clamp(35px,9vw,60px);height:clamp(35px,9vw,60px);object-fit:cover;border-radius:50%;border:2px solid #c99a55;display:block;margin:5px auto';img.onerror=()=>{img.replaceWith(document.createTextNode('👤'))};portrait.append(img)}else{const fallback=document.createElement('span');fallback.textContent=player.name.startsWith('الكمبيوتر')?'🤖':'👤';fallback.style.cssText='font-size:clamp(27px,7vw,45px);display:block';portrait.append(fallback)}const n=document.createElement('div');n.textContent=player.name;n.style.cssText='font-size:clamp(11px,2.5vw,17px);font-weight:900';portrait.append(n)}else portrait.textContent=''}
socket.on('connect',()=>socket.emit('list'));
</script></body></html>
