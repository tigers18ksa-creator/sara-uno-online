<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مونوبولي | مجلس سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b253f,#100b19);color:#f9e6b8;font:15px Tahoma,Arial}header{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px;background:#170f20;border-bottom:2px solid #b78b48}h1{margin:0;font-size:23px}button,select,input{font:inherit;border:1px solid #b99357;border-radius:10px;background:#38203c;color:#fff;padding:10px;cursor:pointer}button:disabled{opacity:.4}main{max-width:1100px;margin:auto;padding:12px}.panel{background:#211526e8;border:1px solid #947048;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));aspect-ratio:1;max-width:690px;width:100%;background:#d6c69f;border:5px solid #a47c40;border-radius:10px;overflow:hidden;direction:ltr}.tile{min-width:0;position:relative;border:1px solid #65533f;color:#201729;background:#e6d8b4;font-size:clamp(7px,1.5vw,11px);text-align:center;padding:2px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.tile .stripe{height:7px;background:#94436d}.tile b{font-size:clamp(8px,1.3vw,12px)}.tile small{font-size:9px}.tile .tokens{font-size:clamp(9px,1.7vw,15px);white-space:nowrap}.center{grid-column:2/12;grid-row:2/12;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(#f1e0bd,#baa78b);color:#552c42;gap:12px;text-align:center;padding:10px}.center h2{font-size:clamp(25px,6vw,56px);margin:0}.gameLayout{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.side{width:min(100%,300px);flex:1 1 250px}.boardWrap{flex:1 1 330px;max-width:690px}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{padding:9px;background:#34243b;border-radius:10px;border:1px solid #665067}.active{border-color:#ffe077;box-shadow:0 0 13px #d9a94e}.chat{height:180px;overflow-y:auto;background:#130e1b;border-radius:9px;padding:8px;margin:8px 0}.chat p{margin:5px 0;overflow-wrap:anywhere}.chatForm{display:flex;gap:6px}.chatForm input{min-width:0;flex:1}#radioBox[hidden],section[hidden]{display:none}#radioBox audio{width:100%;margin-top:8px}.status{line-height:1.8;color:#f5d99d}.sub{font-size:12px;color:#d4bba1}#tables button{margin:5px}a{color:#f9d48b}@media(max-width:600px){.boardWrap{flex:1 1 100%;max-width:100%;overflow:visible}.board{width:100%;min-width:0;max-width:100%;aspect-ratio:1}.tile{font-size:clamp(7px,1.7vw,10px);padding:1px}.tile b{font-size:clamp(8px,2vw,12px)}.tile small{display:none}.tile .tokens{font-size:clamp(9px,2.5vw,14px)}.panel{padding:9px}header h1{font-size:17px}}.tile.stepGlow{background:#fff1ad!important;box-shadow:inset 0 0 0 2px #f5a900}.diceFx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9999;font-size:70px;pointer-events:none;animation:diceSpin .9s ease-out both;text-shadow:0 8px 18px #0009}@keyframes diceSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(.5);opacity:0}30%{opacity:1}80%{transform:translate(-50%,-50%) rotate(600deg) scale(1.4)}100%{transform:translate(-50%,-50%) rotate(720deg) scale(1);opacity:0}}</style></head><body><header><button onclick="back()">⌂ ردهة الألعاب</button><h1>🎩 مونوبولي | مجلس سارة</h1><button onclick="document.getElementById('radioBox').hidden=!document.getElementById('radioBox').hidden">📻 الراديو</button></header><main><div id="radioBox" class="panel" hidden><b>📻 الراديو — تشغيل مستقل لكل عضو</b><div class="row"><select id="station"><option value="">اختر المحطة</option><option value="https://stream.radiojar.com/8s5u5tpdtwzuv">راديو عربي</option><option value="/api/radio/rotana">روتانا</option></select><button onclick="playRadio()">▶ تشغيل</button><button onclick="document.getElementById('audio').pause()">⏸ إيقاف</button></div><audio id="audio" controls playsinline></audio></div><section id="entry" class="panel"><h2>🎲 طاولات مونوبولي</h2><p>4 لاعبين حقيقيين، ومشاهدة مفتوحة للجميع.</p><input id="name" maxlength="24" placeholder="اسمك"><button onclick="create()">➕ افتح طاولة</button><button onclick="socket.emit('list')">تحديث الطاولات</button><div id="tables"></div></section><section id="game" hidden><div class="gameLayout"><div class="boardWrap"><div class="board" id="board"></div></div><div class="side"><div class="panel"><div id="players" class="players"></div><p id="status" class="status"></p><p id="watchers" class="sub"></p><div class="row"><button id="bots" onclick="socket.emit('addBots')">🤖 العب مع الكمبيوتر</button><button id="start" onclick="socket.emit('start')">▶ ابدأ اللعب</button><button id="roll" onclick="roll()">🎲 ارمِ النرد</button><button id="buy" onclick="socket.emit('buy')">🏠 شراء العقار</button><button id="end" onclick="socket.emit('end')">التالي ◀</button></div></div><div class="panel"><b>💬 شات الطاولة</b><div class="chat" id="messages"></div><form class="chatForm" onsubmit="send(event)"><input id="message" maxlength="250" placeholder="اكتب رسالة..."><button>إرسال</button></form></div><button onclick="leave()">خروج للطاولات</button></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/monopoly'),$=id=>document.getElementById(id);let current=null,lastDice='',lastPosition=-1,audioCtx=null;
function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=kind==='buy'?[520,660,820]:kind==='rent'?[330,250]:[300,420,540];notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=kind==='roll'?'triangle':'sine';osc.frequency.setValueAtTime(hz,now+i*.1);gain.gain.setValueAtTime(.0001,now+i*.1);gain.gain.exponentialRampToValueAtTime(.075,now+i*.1+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.1);osc.stop(now+i*.1+.14)})}catch(e){}}
let diceTimer=null;
function rollFx(values){if(!Array.isArray(values)||values.length!==2)return;clearTimeout(diceTimer);document.querySelectorAll('.diceFx').forEach(e=>e.remove());sound('roll');const el=document.createElement('div');el.className='diceFx';el.style.animation='none';el.style.display='flex';el.style.gap='16px';el.style.alignItems='center';el.style.justifyContent='center';el.style.transition='transform .15s';el.innerHTML='<span>🎲</span><span>🎲</span>';document.body.append(el);const faces=['','⚀','⚁','⚂','⚃','⚄','⚅'];let count=0;const spin=setInterval(()=>{el.style.transform='translate(-50%,-50%) rotate('+(count*48)+'deg) scale(1.1)';el.children[0].textContent=faces[1+Math.floor(Math.random()*6)];el.children[1].textContent=faces[1+Math.floor(Math.random()*6)];if(++count>=9){clearInterval(spin);el.style.transform='translate(-50%,-50%) rotate(0deg) scale(1.25)';el.children[0].textContent=faces[values[0]]||'🎲';el.children[1].textContent=faces[values[1]]||'🎲';diceTimer=setTimeout(()=>el.remove(),2000)}},100)}
function roll(){socket.emit('roll')}
const hash=new URLSearchParams(location.hash.slice(1));$('name').value=hash.get('name')||sessionStorage.getItem('saraName')||localStorage.getItem('saraName')||'';
function back(){socket.emit('leave');location.href='/uno.html'+(location.hash||'#games')}
function playRadio(){const v=$('station').value;if(!v)return;const a=$('audio');a.src=v;a.play().catch(()=>alert('تعذر تشغيل المحطة، اختر محطة أخرى'))}
function name(){const n=$('name').value.trim()||'ضيف';sessionStorage.setItem('saraName',n);return n}
function create(){socket.emit('create',name())}
function join(id,watch){socket.emit('join',{id,name:name(),watch})}
function leave(){socket.emit('leave');current=null;$('game').hidden=true;$('entry').hidden=false}
function send(e){e.preventDefault();const v=$('message').value.trim();if(v)socket.emit('chat',v);$('message').value=''}
socket.on('errorMessage',alert);
socket.on('tables',tables=>{$('tables').replaceChildren();if(!tables.length)$('tables').textContent='لا توجد طاولات حاليًا';tables.forEach(t=>{const d=document.createElement('div');d.className='panel';const label=document.createElement('span');label.textContent='طاولة '+t.id+' — '+t.players.length+'/4 لاعبين — 👁️ '+t.watchers+' ';d.append(label);for(const [title,watch] of [['انضم لاعب',false],['مشاهدة',true]]){const b=document.createElement('button');b.textContent=title;b.disabled=!watch&&(t.started||t.players.length>=4);b.onclick=()=>join(t.id,watch);d.append(b)}$('tables').append(d)})});
socket.on('state',g=>{current=g;$('entry').hidden=true;$('game').hidden=false;$('players').replaceChildren();g.players.forEach((p,i)=>{const d=document.createElement('div');d.className='player '+(g.turn===i?'active':'');d.textContent=['🔴','🔵','🟢','🟡'][i]+' '+p.name+' — '+p.cash+' 💵'+(p.bankrupt?' (مفلس)':'');$('players').append(d)});$('status').textContent=(!g.started&&g.players.length<4?'بانتظار '+(4-g.players.length)+' لاعبين للبدء. افتح طاولة أخرى أو شارك رابط اللعبة مع الأعضاء.':g.log)+(g.dice.length?' | 🎲 '+g.dice.join(' + '):'');$('watchers').textContent='👁️ المشاهدون: '+g.watchers+' '+g.watcherNames.join('، ');$('bots').hidden=!g.host||g.started||g.players.length===4;$('start').hidden=!g.host||g.started||g.players.length!==4;const turn=g.started&&!g.ended&&g.you===g.turn;$('roll').disabled=!turn||g.rolled;$('end').disabled=!turn||!g.rolled;$('buy').disabled=!turn||!g.rolled||!g.prices[g.players[g.you]?.pos]||g.owners[g.players[g.you]?.pos]!==-1||g.players[g.you].cash<g.prices[g.players[g.you].pos];renderBoard(g);if(g.started&&g.dice.length){const stamp=g.id+':'+g.turn+':'+g.dice.join('-')+':'+g.rolled;if(stamp!==lastDice){lastDice=stamp;rollFx(g.dice);if(/اشترى/.test(g.log))sound('buy');else if(/إيجار/.test(g.log))sound('rent')}}});
socket.on('chat',m=>{const p=document.createElement('p');const b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));$('messages').append(p);$('messages').scrollTop=$('messages').scrollHeight});
function renderBoard(g){const board=$('board');board.replaceChildren();const positions=[];for(let x=10;x>=0;x--)positions.push([10,x]);for(let y=9;y>=0;y--)positions.push([y,0]);for(let x=1;x<=10;x++)positions.push([0,x]);for(let y=1;y<=9;y++)positions.push([y,10]);positions.forEach(([y,x],i)=>{const d=document.createElement('div');d.className='tile';d.style.gridRow=11-y;d.style.gridColumn=x+1;const stripe=document.createElement('div');stripe.className='stripe';stripe.style.background=g.owners[i]===-1?['#873c69','#2d6a7a','#9c783b'][Math.floor(i/14)]:['#e24c5d','#3989e3','#34a76b','#e9bd3d'][g.owners[i]];const title=document.createElement('span');title.textContent=g.names[i];const cost=document.createElement('small');cost.textContent=g.prices[i]||'';const tokens=document.createElement('b');tokens.className='tokens';tokens.textContent=g.players.map((p,j)=>p.pos===i&&!p.bankrupt?['🔴','🔵','🟢','🟡'][j]:'').join('');d.append(stripe,title,cost,tokens);board.append(d)});const center=document.createElement('div');center.className='center';center.innerHTML='<h2>MONOPOLY</h2><b>مجلس سارة ♛</b><span>🎩 🎲 🏠</span>';board.append(center)}
socket.on('connect',()=>socket.emit('list'));
</script></body></html>
