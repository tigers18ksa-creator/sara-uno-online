<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مونوبولي | مجلس سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b253f,#100b19);color:#f9e6b8;font:15px Tahoma,Arial}header{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px;background:#170f20;border-bottom:2px solid #b78b48}h1{margin:0;font-size:23px}button,select,input{font:inherit;border:1px solid #b99357;border-radius:10px;background:#38203c;color:#fff;padding:10px;cursor:pointer}button:disabled{opacity:.4}main{max-width:1100px;margin:auto;padding:12px}.panel{background:#211526e8;border:1px solid #947048;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.board{display:grid;grid-template-columns:1.45fr repeat(9,minmax(0,1fr)) 1.45fr;grid-template-rows:1.45fr repeat(9,minmax(0,1fr)) 1.45fr;aspect-ratio:1;max-width:690px;width:100%;background:#d6c69f;border:5px solid #a47c40;border-radius:10px;overflow:hidden;direction:ltr}.tile{min-width:0;position:relative;border:1px solid #65533f;color:#201729;background:#e6d8b4;font-size:clamp(9px,2vw,15px);text-align:center;padding:2px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.tile .stripe{height:7px;background:#94436d}.tile span:not(.stripe){font-weight:900;text-shadow:0 0 .2px currentColor}.tile b{font-size:clamp(9px,1.8vw,15px)}.tile small{font-size:9px}.tile .tokens{font-size:clamp(9px,1.7vw,15px);white-space:nowrap}.center{grid-column:2/11;grid-row:2/11;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(#f1e0bd,#baa78b);color:#552c42;gap:12px;text-align:center;padding:10px}.center h2{font-size:clamp(25px,6vw,56px);margin:0}.gameLayout{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.side{width:min(100%,300px);flex:1 1 250px}.boardWrap{flex:1 1 330px;max-width:690px}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{padding:9px;background:#34243b;border-radius:10px;border:1px solid #665067}.active{border-color:#ffe077;box-shadow:0 0 13px #d9a94e}.chat{height:180px;overflow-y:auto;background:#130e1b;border-radius:9px;padding:8px;margin:8px 0}.chat p{margin:5px 0;overflow-wrap:anywhere}.chatForm{display:flex;gap:6px}.chatForm input{min-width:0;flex:1}#radioBox[hidden],section[hidden]{display:none}#radioBox audio{width:100%;margin-top:8px}.status{line-height:1.8;color:#f5d99d}.sub{font-size:12px;color:#d4bba1}#tables button{margin:5px}a{color:#f9d48b}@media(max-width:600px){.boardWrap{flex:1 1 100%;max-width:100%;overflow:visible}.board{width:100%;min-width:0;max-width:100%;aspect-ratio:1}.tile{font-size:clamp(9px,2.45vw,14px);padding:1px}.tile b{font-size:clamp(9px,2.3vw,14px)}.tile small{display:none}.tile .tokens{font-size:clamp(9px,2.5vw,14px)}.panel{padding:9px}header h1{font-size:17px}}.tokens{display:flex;justify-content:center;align-items:end;gap:1px;min-height:15px;flex-wrap:wrap}.pawn{--pawn:#cf273c;--light:#ff9ba5;display:inline-block;position:relative;width:clamp(7px,1.6vw,12px);height:clamp(12px,2.8vw,19px);flex:none;filter:drop-shadow(0 1px 1px #0008)}.pawn:before{content:'';position:absolute;top:0;left:27%;width:46%;height:36%;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--light),var(--pawn) 65%,#17131c 120%)}.pawn:after{content:'';position:absolute;bottom:0;left:5%;width:90%;height:65%;border-radius:45% 45% 25% 25%;background:radial-gradient(ellipse at 28% 20%,var(--light),var(--pawn) 62%,#151018 125%);border-bottom:2px solid #e8c67b;box-shadow:inset 0 -2px 2px #0005}.pawn-0{--pawn:#ce223c;--light:#ffa6b0}.pawn-1{--pawn:#1877c5;--light:#a4e3ff}.pawn-2{--pawn:#168b49;--light:#a7f5bc}.pawn-3{--pawn:#d49b14;--light:#fff0a0}.player .pawn{width:16px;height:24px;vertical-align:middle;margin-inline-end:7px}.tile .tokens{font-size:0;min-height:24px;overflow:visible}.tile .pawn{width:clamp(13px,3.5vw,21px);height:clamp(21px,5.5vw,32px);z-index:3;filter:drop-shadow(0 2px 3px #000a)}.tile.special-start{background:#174B38;border-color:#48B487;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-chance{background:#785214;border-color:#E6B74C;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-chest{background:#4B3076;border-color:#B29AE5;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-tax{background:#762B37;border-color:#E68C97;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-jail{background:#764022;border-color:#DDA174;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-parking{background:#204E75;border-color:#79B5E5;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-gojail{background:#702C56;border-color:#D985B5;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-rail{background:#343D50;border-color:#A2B2D1;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.special-utility{background:#155A59;border-color:#65C6C1;color:#fff;font-weight:900;text-shadow:0 1px 2px #0008}.tile.stepGlow{background:#fff1ad!important;box-shadow:inset 0 0 0 3px #f5a900,0 0 12px #ffdb42!important;z-index:2}.tile.stepGlow .pawn{animation:saraPawnHop .32s ease-in-out}@keyframes saraPawnHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}.die{width:clamp(72px,19vw,112px);height:clamp(72px,19vw,112px);border-radius:20%;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13%;box-shadow:inset 5px 6px 10px #ffffff90,inset -8px -9px 12px #0008,0 12px 20px #0009,0 0 0 2px #ffffff70;transform:rotate(-8deg);border:2px solid #ffffff80}.die.red{background:linear-gradient(135deg,#ff8383 0%,#f21c31 40%,#950013 100%)}.die.blue{background:linear-gradient(135deg,#9be9ff 0%,#147bff 40%,#003a9d 100%);transform:rotate(8deg)}.die .pip{width:75%;height:75%;border-radius:50%;align-self:center;justify-self:center;background:radial-gradient(circle at 35% 30%,#fff,#e4eaf2 72%,#9ca6b6);box-shadow:inset 0 2px 2px #8888,0 1px 1px #fff9}.diceFx{gap:16px!important}.diceFx .die{flex:none}.diceFx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9999;font-size:70px;pointer-events:none;animation:diceSpin .9s ease-out both;text-shadow:0 8px 18px #0009}@keyframes diceSpin{0%{transform:translate(-50%,-50%) rotate(0deg) scale(.5);opacity:0}30%{opacity:1}80%{transform:translate(-50%,-50%) rotate(600deg) scale(1.4)}100%{transform:translate(-50%,-50%) rotate(720deg) scale(1);opacity:0}} .eventReveal{position:fixed;inset:0;z-index:10020;display:grid;place-items:center;background:#090512b8;padding:20px}.eventReveal[hidden]{display:none}.eventCard{width:min(92vw,390px);padding:28px 20px;text-align:center;border-radius:24px;border:3px solid #dfb85e;background:linear-gradient(145deg,#39213d,#140e22);box-shadow:0 20px 60px #000a,0 0 35px #d8a34b55;animation:cardEnter .45s ease-out}.eventCard .eventIcon{font-size:65px;display:block}.eventCard h2{font-size:27px;color:#ffe4a0}.eventCard p{font-size:18px;line-height:1.7;color:white;white-space:pre-wrap}@keyframes cardEnter{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:scale(1)}} .tile .ownerTag{position:absolute;bottom:1px;left:1px;right:1px;z-index:4;background:#19111fe8;color:#fff;border:1px solid #ffe5a4;border-radius:4px;font-size:clamp(7px,1.5vw,11px);font-weight:900;line-height:1.25;padding:2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px #0009}.tile.owned{box-shadow:inset 0 0 0 3px var(--owner-color)!important;border-color:var(--owner-color)!important}.tile.owned .stripe{height:10px!important;background:var(--owner-color)!important}.tile.owned .tokens{margin-bottom:17px}</style></head><body><header><button onclick="back()">⌂ ردهة الألعاب</button><h1>🎩 مونوبولي | مجلس سارة</h1><button onclick="document.getElementById('radioBox').hidden=!document.getElementById('radioBox').hidden">📻 الراديو</button></header><main><div id="radioBox" class="panel" hidden><b>📻 الراديو — تشغيل مستقل لكل عضو</b><div class="row"><select id="station"><option value="">اختر المحطة</option><option value="https://stream.radiojar.com/8s5u5tpdtwzuv">راديو عربي</option><option value="/api/radio/rotana">روتانا</option></select><button onclick="playRadio()">▶ تشغيل</button><button onclick="document.getElementById('audio').pause()">⏸ إيقاف</button></div><audio id="audio" controls playsinline></audio></div><section id="entry" class="panel"><h2>🎲 طاولات مونوبولي</h2><p>4 لاعبين حقيقيين، ومشاهدة مفتوحة للجميع.</p><input id="name" maxlength="24" placeholder="اسمك"><button onclick="create()">➕ افتح طاولة</button><button onclick="socket.emit('list')">تحديث الطاولات</button><div id="tables"></div></section><section id="game" hidden><div class="gameLayout"><div class="boardWrap"><div class="board" id="board"></div></div><div class="side"><div class="panel"><div id="players" class="players"></div><p id="status" class="status"></p><p id="watchers" class="sub"></p><div class="row"><button id="bots" onclick="socket.emit('addBots')">🤖 العب مع الكمبيوتر</button><button id="start" onclick="socket.emit('start')">▶ ابدأ اللعب</button><button id="roll" onclick="roll()">🎲 ارمِ النرد</button><button id="buy" onclick="socket.emit('buy')">🏠 شراء العقار</button><button id="end" onclick="socket.emit('end')">التالي ◀</button></div></div><div class="panel"><b>💬 شات الطاولة</b><div class="chat" id="messages"></div><form class="chatForm" onsubmit="send(event)"><input id="message" maxlength="250" placeholder="اكتب رسالة..."><button>إرسال</button></form></div><button onclick="leave()">خروج للطاولات</button></div></div></section></main><div id="eventReveal" class="eventReveal" hidden><div class="eventCard"><span class="eventIcon" id="eventIcon">🎁</span><h2 id="eventTitle"></h2><p id="eventText"></p><button onclick="hideEvent()">حسنًا ✓</button></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io('/monopoly'),$=id=>document.getElementById(id);let current=null,lastDice='',lastPosition=-1,audioCtx=null;
function sound(kind){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=kind==='buy'?[520,660,820]:kind==='rent'?[330,250]:[300,420,540];notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=kind==='roll'?'triangle':'sine';osc.frequency.setValueAtTime(hz,now+i*.1);gain.gain.setValueAtTime(.0001,now+i*.1);gain.gain.exponentialRampToValueAtTime(.075,now+i*.1+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.13);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.1);osc.stop(now+i*.1+.14)})}catch(e){}}
let diceTimer=null,visualPositions=null,moveTimer=null,moveKey='',previousPositions=null,eventTimer=null,lastEventKey='';function hideEvent(){clearTimeout(eventTimer);$('eventReveal').hidden=true}function showEvent(title,icon,detail){$('eventTitle').textContent=title;$('eventIcon').textContent=icon;$('eventText').textContent=detail||'تم سحب البطاقة';$('eventReveal').hidden=false;clearTimeout(eventTimer);eventTimer=setTimeout(hideEvent,6000)}function jailSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let t=audioCtx.currentTime;[440,330,220,165].forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(hz,t+i*.22);g.gain.setValueAtTime(.0001,t+i*.22);g.gain.exponentialRampToValueAtTime(.09,t+i*.22+.025);g.gain.exponentialRampToValueAtTime(.0001,t+i*.22+.2);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.22);o.stop(t+i*.22+.21)})}catch(e){}}function landedEvent(g,moved,destination){if([2,17,33,7,22,37].includes(destination)){showEvent([2,17,33].includes(destination)?'صندوق الحظ 🎁':'بطاقة الفرصة ✨',[2,17,33].includes(destination)?'🎁':'🃏',g.log)}else if(destination===10&&(/سجن|اذهب/.test(g.log)||g.players[moved]?.jail)){jailSound();showEvent('🚔 دخلت السجن!','🔒',g.log)}}
function makeDie(value,color){const die=document.createElement('div');die.className='die '+color;const spots={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};for(const n of spots[value]||[]){const p=document.createElement('span');p.className='pip';p.style.gridColumn=(n-1)%3+1;p.style.gridRow=Math.floor((n-1)/3)+1;die.append(p)}return die}
function rollFx(values){if(!Array.isArray(values)||values.length!==2)return;clearTimeout(diceTimer);document.querySelectorAll('.diceFx').forEach(e=>e.remove());sound('roll');const el=document.createElement('div');el.className='diceFx';el.style.animation='none';el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.transition='transform .15s';document.body.append(el);let count=0;const draw=(a,b)=>{el.replaceChildren(makeDie(a,'red'),makeDie(b,'blue'))};draw(1,1);const spin=setInterval(()=>{draw(1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6));el.style.transform='translate(-50%,-50%) rotate('+(count%2?12:-12)+'deg) scale(1.08)';if(++count>=10){clearInterval(spin);draw(values[0],values[1]);el.style.transform='translate(-50%,-50%) rotate(0deg) scale(1)';diceTimer=setTimeout(()=>el.remove(),2000)}},95)}
function stepSound(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),v=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(390,t+.09);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.045,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(v);v.connect(audioCtx.destination);o.start(t);o.stop(t+.13)}catch(e){}}function animatePawn(g,oldPos){clearTimeout(moveTimer);const moved=g.players.findIndex((p,i)=>oldPos[i]!==undefined&&oldPos[i]!==p.pos&&!p.bankrupt);if(moved<0)return;const destination=g.players[moved].pos;const steps=g.dice.reduce((a,b)=>a+b,0);if(steps<1||steps>12)return;const from=oldPos[moved];const goJail=destination===10&&(/سجن|اذهب/.test(g.log));if((from+steps)%40!==destination&&!goJail)return;visualPositions=g.players.map(p=>p.pos);visualPositions[moved]=from;let n=0;const advance=()=>{if(!current||current.id!==g.id){visualPositions=null;return}n++;visualPositions[moved]=(from+n)%40;stepSound();renderBoard(current,visualPositions[moved]);if(n<steps)moveTimer=setTimeout(advance,350);else moveTimer=setTimeout(()=>{if(goJail){visualPositions[moved]=30;renderBoard(current,30);$('status').textContent='🚔 اذهب إلى السجن!';jailSound();moveTimer=setTimeout(()=>{visualPositions[moved]=10;renderBoard(current,10);finishMove()},1000)}else finishMove();function finishMove(){visualPositions=null;renderBoard(current);$('status').textContent=current.log+(current.dice.length?' | 🎲 '+current.dice.join(' + '):'');landedEvent(g,moved,destination);if(/اشترى/.test(g.log))sound('buy');else if(/إيجار/.test(g.log))sound('rent')}},450)};moveTimer=setTimeout(advance,2050)}function roll(){socket.emit('roll')}
const hash=new URLSearchParams(location.hash.slice(1));$('name').value=hash.get('name')||sessionStorage.getItem('saraName')||localStorage.getItem('saraName')||'';
function back(){socket.emit('leave');location.href='/uno.html'+(location.hash||'#games')}
function playRadio(){const v=$('station').value;if(!v)return;const a=$('audio');a.src=v;a.play().catch(()=>alert('تعذر تشغيل المحطة، اختر محطة أخرى'))}
function name(){const n=$('name').value.trim()||'ضيف';sessionStorage.setItem('saraName',n);return n}
function create(){socket.emit('create',name())}
function join(id,watch){socket.emit('join',{id,name:name(),watch})}
function leave(){socket.emit('leave');current=null;$('game').hidden=true;$('entry').hidden=false}
function send(e){e.preventDefault();const v=$('message').value.trim();if(v)socket.emit('chat',v);$('message').value=''}
socket.on('errorMessage',alert);
socket.on('tables',tables=>{$('tables').replaceChildren();if(!tables.length)$('tables').textContent='لا توجد طاولات حاليًا';tables.forEach(t=>{const d=document.createElement('div');d.className='panel';const label=document.createElement('span');label.textContent='طاولة '+t.id+' — '+t.players.length+'/4 لاعبين — 👁️ '+t.watchers+' ';d.append(label);for(const [title,watch] of [['انضم لاعب',false],['مشاهدة',true]]){const b=document.createElement('button');b.textContent=title;b.disabled=!watch&&(t.started||t.players.length>=4);b.onclick=()=>join(t.id,watch);d.append(b)}$('tables').append(d)})});
socket.on('state',g=>{const oldPos=previousPositions;const nextPos=g.players.map(p=>p.pos);const hasNewMove=!!(g.started&&g.dice.length&&oldPos&&oldPos.length===nextPos.length&&nextPos.some((pos,i)=>pos!==oldPos[i]));previousPositions=nextPos;current=g;$('entry').hidden=true;$('game').hidden=false;$('players').replaceChildren();g.players.forEach((p,i)=>{const d=document.createElement('div');d.className='player '+(g.turn===i?'active':'');const pawn=document.createElement('span');pawn.className='pawn pawn-'+i;d.append(pawn,document.createTextNode(p.name+' — '+p.cash+' 💵'+(p.bankrupt?' (مفلس)':'')));$('players').append(d)});$('status').textContent=(!g.started&&g.players.length<4?'بانتظار '+(4-g.players.length)+' لاعبين للبدء. افتح طاولة أخرى أو شارك رابط اللعبة مع الأعضاء.':g.log)+(g.dice.length?' | 🎲 '+g.dice.join(' + '):'');$('watchers').textContent='👁️ المشاهدون: '+g.watchers+' '+g.watcherNames.join('، ');$('bots').hidden=!g.host||g.started||g.players.length===4;$('start').hidden=!g.host||g.started||g.players.length!==4;const turn=g.started&&!g.ended&&g.you===g.turn;$('roll').disabled=!turn||g.rolled;$('end').disabled=!turn||!g.rolled;$('buy').disabled=!turn||!g.rolled||!g.prices[g.players[g.you]?.pos]||g.owners[g.players[g.you]?.pos]!==-1||g.players[g.you].cash<g.prices[g.players[g.you].pos];if(hasNewMove){visualPositions=oldPos.slice();$('status').textContent='🎲 النرد يدور... انتظر ظهور النتيجة ثم تحرّك الحجر';}renderBoard(g);if(g.started&&g.dice.length){const stamp=g.id+':'+g.turn+':'+g.dice.join('-')+':'+g.rolled;if(stamp!==lastDice){lastDice=stamp;rollFx(g.dice);if(oldPos&&oldPos.length===g.players.length)animatePawn(g,oldPos)}}});
socket.on('chat',m=>{const p=document.createElement('p');const b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));$('messages').append(p);$('messages').scrollTop=$('messages').scrollHeight});
function renderBoard(g,glowPos=-1){const board=$('board');board.replaceChildren();const positions=[];for(let x=10;x>=0;x--)positions.push([10,x]);for(let y=9;y>=0;y--)positions.push([y,0]);for(let x=1;x<=10;x++)positions.push([0,x]);for(let y=1;y<=9;y++)positions.push([y,10]);positions.forEach(([y,x],i)=>{const d=document.createElement('div');d.className='tile';const specialClass=({0:'special-start',2:'special-chest',4:'special-tax',5:'special-rail',7:'special-chance',10:'special-jail',12:'special-utility',15:'special-rail',17:'special-chest',20:'special-parking',22:'special-chance',25:'special-rail',28:'special-utility',30:'special-gojail',33:'special-chest',35:'special-rail',37:'special-chance'})[i];if(specialClass)d.classList.add(specialClass);if(i===glowPos)d.classList.add('stepGlow');const owner=g.owners[i];if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){d.classList.add('owned');d.style.setProperty('--owner-color',['#ed4054','#3188ec','#22ad61','#f4bf35'][owner]||'#d6ac5c')}d.style.gridRow=11-y;d.style.gridColumn=x+1;const stripe=document.createElement('div');stripe.className='stripe';stripe.style.background=g.owners[i]===-1?['#873c69','#2d6a7a','#9c783b'][Math.floor(i/14)]:['#e24c5d','#3989e3','#34a76b','#e9bd3d'][g.owners[i]];const title=document.createElement('span');title.textContent=g.names[i];const cost=document.createElement('small');cost.textContent=g.prices[i]||'';const tokens=document.createElement('b');tokens.className='tokens';g.players.forEach((p,j)=>{if((visualPositions?visualPositions[j]:p.pos)===i&&!p.bankrupt){const t=document.createElement('span');t.className='pawn pawn-'+j;tokens.append(t)}});d.append(stripe,title,cost,tokens);if(Number.isInteger(owner)&&owner>=0&&g.players[owner]){const tag=document.createElement('strong');tag.className='ownerTag';tag.textContent='♛ '+g.players[owner].name;d.append(tag)}board.append(d)});const center=document.createElement('div');center.className='center';center.innerHTML='<h2>MONOPOLY</h2><b>مجلس سارة ♛</b><span>🎩 🎲 🏠</span>';board.append(center)}
socket.on('connect',()=>socket.emit('list'));
</script></body></html>
