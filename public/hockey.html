<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>هوكي الطاولة | مجلس سارة</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38206b,#100c24 70%);color:white;font-family:Tahoma,Arial;min-height:100dvh;text-align:center}header{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:10px}h2{margin:5px;color:#f5cf83}button{background:linear-gradient(#59317d,#241339);border:1px solid #cba96b;border-radius:13px;color:#fff;padding:12px;cursor:pointer;font-weight:bold}button.green{background:#168e52}#lobby{max-width:560px;margin:10px auto;padding:15px}#tables{display:grid;gap:9px;margin-top:20px}.table{display:flex;justify-content:space-between;align-items:center;background:#24153d;border:1px solid #7656a6;border-radius:12px;padding:10px}#arena{display:none}#board{display:block;width:min(96vw,900px);aspect-ratio:0.68;margin:2vh auto;touch-action:none;border:5px solid #5bcaff;border-radius:25px;box-shadow:0 0 28px #087cff88;background:#154bb5}#score{font-size:26px;font-weight:bold}#status{color:#f5d49c;margin:12px}#back{font-size:14px}input{background:#22173c;border:1px solid #bfa2d6;color:white;padding:12px;border-radius:12px;width:90%;max-width:280px}#actions{display:flex;justify-content:center;gap:10px;margin:18px}small{color:#c8bde0}
</style><style>#gameTools{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px}#chatPanel,#radioPanel{position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,440px);max-height:75dvh;overflow:auto;border:2px solid #d5aa73;border-radius:18px;background:#241431;padding:14px;box-shadow:0 12px 45px #000b;text-align:right}#chatPanel[hidden],#radioPanel[hidden]{display:none!important}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#gameChatMessages{height:250px;overflow-y:auto;background:#150f29;border-radius:12px;padding:8px}#gameChatMessages p{background:#f5e9d8;color:#241431;border-radius:10px;padding:8px;margin:6px 0;overflow-wrap:anywhere}#gameChatForm{display:flex;gap:5px;margin-top:8px}#gameChatInput{flex:1;min-width:0}#radioChoices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}#radioChoices button{font-size:12px}#radioVolume{width:100%}#radioStatus{font-size:12px;color:#efcd92}</style><header><button id="back" onclick="location.href='/'">❮ ردهة الألعاب</button><h2>🏒 هوكي الطاولة</h2><span>مجلس سارة</span></header>
<div id="lobby"><p>لاعب ضد لاعب أو ضد الكمبيوتر • أول من يسجل 7 أهداف يفوز</p><input id="name" placeholder="اسم اللاعب" maxlength="24"><div id="actions"><button class="green" onclick="create('online')">إنشاء طاولة أونلاين</button><button onclick="create('cpu')">ضد الكمبيوتر 🤖</button></div><h3>الطاولات</h3><div id="tables">جاري الاتصال...</div></div>
<div id="arena"><div id="gameTools"><button id="radioToggle" type="button">📻 الراديو</button><button id="chatToggle" type="button">💬 شات اللعبة</button></div><div id="score">0 : 0</div><div id="status"></div><canvas id="board" width="600" height="880"></canvas><button onclick="exitGame()">الخروج من الطاولة</button><p><small>اسحب المضرب بإصبعك • يمكن للأعضاء المشاهدة</small></p></div>
<div id="chatPanel" hidden><div class="panelHead"><strong>💬 شات الهوكي</strong><button id="chatClose">✕</button></div><div id="gameChatMessages"></div><form id="gameChatForm"><input id="gameChatInput" maxlength="350" placeholder="اكتب رسالتك..."><button>إرسال</button></form></div><section id="radioPanel" hidden><div class="panelHead"><strong>📻 راديو مجلس سارة</strong><button id="radioClose">✕</button></div><p>اختر محطتك المفضلة</p><div id="radioChoices"></div><select id="radioStation" hidden><option value="MBC FM">MBC FM</option><option value="Panorama FM">بانوراما FM</option><option value="Rotana FM">روتانا FM</option><option value="Alif Alif FM">ألف ألف FM</option><option value="Mix FM">ميكس FM</option><option value="UFM">UFM</option><option value="Bahrain FM 93.3">بحرين FM</option><option value="Iraqi Songs">أغاني عراقية</option><option value="Gulf Songs">أغاني خليجية</option><option value="Egyptian Songs">أغاني مصرية</option><option value="Arabic Hits">توب عربي</option></select><div><button id="radioPlay">▶ تشغيل</button><button id="radioStop">⏹ إيقاف</button><a id="radioExternal" href="https://mbcradios.net/" target="_blank">موقع الإذاعة</a></div><label>🔊 مستوى الصوت <span id="radioVolumeText">50%</span></label><input type="range" min="0" max="100" value="50" id="radioVolume"><p id="radioStatus">اختر محطة ثم اضغط تشغيل</p><div id="radioBahrainEmbed" hidden><iframe title="مشغل احتياطي"></iframe></div><audio id="radioAudio" preload="none"></audio></section><script src="/socket.io/socket.io.js"></script><script src="/radio.js?v=20261109genres1"></script><script>
const qs=new URLSearchParams(location.search),nameEl=document.querySelector('#name');nameEl.value=qs.get('name')||localStorage.getItem('saraName')||localStorage.getItem('username')||'لاعب';const socket=io({transports:['websocket','polling']});let game=null,side=-1,lastEffect=0,audio=null;function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}function sound(type){if(!audio||audio.state!=='running')return;const t=audio.currentTime,o=audio.createOscillator(),gain=audio.createGain();o.type=type==='goal'?'triangle':'sine';o.frequency.setValueAtTime(type==='goal'?620:type==='hit'?260:170,t);o.frequency.exponentialRampToValueAtTime(type==='goal'?950:90,t+(type==='goal'?.32:.095));gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(type==='goal'?.22:.15,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+(type==='goal'?.38:.13));o.connect(gain);gain.connect(audio.destination);o.start(t);o.stop(t+(type==='goal'?.4:.15));}const cv=document.querySelector('#board'),ctx=cv.getContext('2d');
socket.on('connect',()=>socket.emit('hockey:list'));socket.on('hockey:list',rows=>{document.querySelector('#tables').innerHTML=rows.length?'':'لا توجد طاولات الآن';rows.forEach(g=>{const div=document.createElement('div');div.className='table';const span=document.createElement('span');span.textContent=g.players.join(' ضد ')+' • '+(g.status==='waiting'?'بانتظار لاعب':g.status==='playing'?'مباشر':'انتهت')+' • 👁 '+g.spectators;const btn=document.createElement('button');btn.textContent=g.status==='waiting'?'انضمام للعبة':'مشاهدة';btn.className=g.status==='waiting'?'green':'';btn.onclick=()=>join(g.id);div.append(span,btn);document.querySelector('#tables').append(div);});});
function create(mode){unlockAudio();socket.emit('hockey:create',{mode,name:nameEl.value},r=>{if(r?.ok){side=0;document.querySelector('#lobby').style.display='none';document.querySelector('#arena').style.display='block';}})}
function join(id){unlockAudio();socket.emit('hockey:join',{id,name:nameEl.value},r=>{if(r?.ok){side=r.side;document.querySelector('#lobby').style.display='none';document.querySelector('#arena').style.display='block';}})}
document.querySelector('#chatToggle').onclick=()=>document.querySelector('#chatPanel').hidden=false;document.querySelector('#chatClose').onclick=()=>document.querySelector('#chatPanel').hidden=true;document.querySelector('#gameChatForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#gameChatInput');if(input.value.trim())socket.emit('hockey:chat',input.value);input.value='';};socket.on('hockey:chat',m=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));const el=document.querySelector('#gameChatMessages');el.append(p);el.scrollTop=el.scrollHeight;});function exitGame(){socket.emit('hockey:leave');game=null;side=-1;document.querySelector('#lobby').style.display='block';document.querySelector('#arena').style.display='none';socket.emit('hockey:list')}
socket.on('hockey:state',g=>{if(g.effect&&g.effect.seq!==lastEffect){lastEffect=g.effect.seq;sound(g.effect.type);}game=g;document.querySelector('#score').textContent=g.score[0]+' : '+g.score[1];document.querySelector('#status').textContent=g.status==='waiting'?'بانتظار انضمام المنافس':g.status==='finished'?'🏆 الفائز: '+g.winner:(g.players.map(p=>p.name).join(' ضد ')+' • 👁 '+g.spectators);draw();});
function draw(){if(!game)return;const w=600,h=880;ctx.clearRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#1167db');grad.addColorStop(1,'#d12a83');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#c9eaffaa';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,88,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#090c2c';ctx.fillRect(w*.36,0,w*.28,13);ctx.fillRect(w*.36,h-13,w*.28,13);game.paddles.forEach((p,i)=>{ctx.shadowColor=i?'#ff65bb':'#46faff';ctx.shadowBlur=22;ctx.fillStyle=i?'#ff367f':'#1de5ff';ctx.beginPath();ctx.arc(p.y*w,p.x*h,32,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(p.y*w-6,p.x*h-7,12,0,Math.PI*2);ctx.fill();});const px=game.puck.y*w,py=game.puck.x*h,r=26;ctx.shadowColor='#fff0a0';ctx.shadowBlur=25;const gold=ctx.createRadialGradient(px-9,py-12,2,px,py,r);gold.addColorStop(0,'#fffbd1');gold.addColorStop(.28,'#ffe779');gold.addColorStop(.7,'#efb932');gold.addColorStop(1,'#9a5d0d');ctx.fillStyle=gold;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff1a6';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.ellipse(px-9,py-12,8,5,-.5,0,Math.PI*2);ctx.fill();}
function move(e){unlockAudio();if(side<0||!game||game.status!=='playing')return;const r=cv.getBoundingClientRect(),x=(e.clientY-r.top)/r.height,y=(e.clientX-r.left)/r.width;socket.emit('hockey:move',{x,y});}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});window.addEventListener('beforeunload',()=>socket.emit('hockey:leave'));
</script></html>
