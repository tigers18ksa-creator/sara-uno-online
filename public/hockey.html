const qs=new URLSearchParams(location.search),nameEl=document.querySelector('#name');nameEl.value=qs.get('name')||localStorage.getItem('saraName')||localStorage.getItem('username')||'لاعب';const socket=io({transports:['websocket','polling']});let game=null,side=-1,lastEffect=0,audio=null,goalFx=null,winFx=null;function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}let realGoalBuffer=null;fetch('hockey-goal-second.b64').then(r=>{if(!r.ok)throw Error('goal audio');return r.text()}).then(t=>{const bytes=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));const a=audio||new (window.AudioContext||window.webkitAudioContext)();return a.decodeAudioData(bytes.buffer).then(b=>{realGoalBuffer=b})}).catch(()=>{});let realHitBuffer=null;fetch('hockey-real-hit.b64').then(r=>{if(!r.ok)throw Error('audio');return r.text()}).then(t=>{const bytes=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));const a=audio||new (window.AudioContext||window.webkitAudioContext)();return a.decodeAudioData(bytes.buffer).then(b=>{realHitBuffer=b})}).catch(()=>{});
function goalCrowd(){if(!audio||audio.state!=='running')return;const length=Math.ceil(audio.sampleRate*1.15),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);let low=0;for(let i=0;i<length;i++){low=low*.93+(Math.random()*2-1)*.07;data[i]=low;}const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),t=audio.currentTime;src.buffer=buffer;filter.type='bandpass';filter.frequency.value=680;filter.Q.value=.48;gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.35,t+.15);gain.gain.setValueAtTime(.35,t+.65);gain.gain.exponentialRampToValueAtTime(.001,t+1.15);src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start(t);src.stop(t+1.15);}

function note(freq,start,duration,wave='sawtooth',volume=.12){const o=audio.createOscillator(),gain=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(.001,now+start);gain.gain.linearRampToValueAtTime(volume,now+start+.025);gain.gain.exponentialRampToValueAtTime(.001,now+start+duration);o.connect(gain);gain.connect(audio.destination);o.start(now+start);o.stop(now+start+duration+.01);}
if(type==='goal'){goalCrowd();}if(type==='goal'&&realGoalBuffer){const src=audio.createBufferSource(),gain=audio.createGain();src.buffer=realGoalBuffer;gain.gain.value=.9;src.connect(gain);gain.connect(audio.destination);src.start(now);return;}if(type==='goal'){[392,494,587,784].forEach((f,i)=>note(f,i*.13,.32,'triangle',.16));note(196,.05,.8,'sawtooth',.08);note(294,.24,.9,'sawtooth',.07);[0,.12,.24,.36,.48,.6,.72].forEach((t,i)=>note(900+i*90,t+.5,.11,'sine',.06));return;}
if(type==='hit'&&realHitBuffer){const src=audio.createBufferSource(),gain=audio.createGain();src.buffer=realHitBuffer;gain.gain.value=Math.min(1.2,.55+.18*force);src.connect(gain);gain.connect(audio.destination);src.start(now);return;}if(type==='hit'){const duration=.075,buffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*duration),audio.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/samples.length*9);const source=audio.createBufferSource(),noiseGain=audio.createGain();source.buffer=buffer;noiseGain.gain.value=Math.min(.32,.16+.07*force);source.connect(noiseGain);noiseGain.connect(audio.destination);source.start(now);note(290,0,.11,'triangle',Math.min(.22,.12+.05*force));return;}const t=now,o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(90,t+.095);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.min(.2,.06+.1*force),t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(gain);gain.connect(audio.destination);o.start(t);o.stop(t+.15);
}const cv=document.querySelector('#board'),ctx=cv.getContext('2d');
socket.on('connect',()=>socket.emit('hockey:list'));socket.on('hockey:list',rows=>{document.querySelector('#tables').innerHTML=rows.length?'':'لا توجد طاولات الآن';rows.forEach(g=>{const div=document.createElement('div');div.className='table';const span=document.createElement('span');span.textContent=g.players.join(' ضد ')+' • '+(g.status==='waiting'?'بانتظار لاعب':g.status==='playing'?'مباشر':'انتهت')+' • 👁 '+g.spectators;const btn=document.createElement('button');btn.textContent=g.status==='waiting'?'انضمام للعبة':'مشاهدة';btn.className=g.status==='waiting'?'green':'';btn.onclick=()=>join(g.id);div.append(span,btn);document.querySelector('#tables').append(div);});});
function create(mode){unlockAudio();socket.emit('hockey:create',{mode,name:nameEl.value},r=>{if(r?.ok){side=0;document.querySelector('#lobby').style.display='none';document.querySelector('#arena').style.display='block';}})}
function join(id){unlockAudio();socket.emit('hockey:join',{id,name:nameEl.value},r=>{if(r?.ok){side=r.side;document.querySelector('#lobby').style.display='none';document.querySelector('#arena').style.display='block';}})}
document.querySelector('#chatToggle').onclick=()=>document.querySelector('#chatPanel').hidden=false;document.querySelector('#chatClose').onclick=()=>document.querySelector('#chatPanel').hidden=true;document.querySelector('#gameChatForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#gameChatInput');if(input.value.trim())socket.emit('hockey:chat',input.value);input.value='';};socket.on('hockey:chat',m=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.msg));const el=document.querySelector('#gameChatMessages');el.append(p);el.scrollTop=el.scrollHeight;});function exitGame(){socket.emit('hockey:leave');game=null;side=-1;document.querySelector('#lobby').style.display='block';document.querySelector('#arena').style.display='none';socket.emit('hockey:list')}
socket.on('hockey:state',g=>{if(g.effect&&g.effect.seq!==lastEffect){lastEffect=g.effect.seq;sound(g.effect.type,g.effect.force||1);if(g.effect.type==='hit'&&g.effect.hitter===side&&navigator.vibrate)navigator.vibrate(35);if(g.effect.type==='goal'){goalFx={start:performance.now(),end:g.effect.scorer===0?(side===0?'top':'bottom'):(side===0?'bottom':'top')};requestAnimationFrame(goalAnimation);}}if(g.status==='finished'&&game?.status!=='finished'){winFx={start:performance.now(),winner:g.winner};requestAnimationFrame(winAnimation);if(navigator.vibrate)navigator.vibrate([100,60,120,60,180]);}game=g;document.querySelector('#score').textContent=g.score[0]+' : '+g.score[1];document.querySelector('#status').textContent=g.status==='waiting'?'بانتظار انضمام المنافس':g.status==='finished'?'🏆 الفائز: '+g.winner:(g.players.map(p=>p.name).join(' ضد ')+' • 👁 '+g.spectators);draw();});
function draw(){if(!game)return;const w=600,h=880;ctx.clearRect(0,0,w,h);
const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#fdfdff');bg.addColorStop(.55,'#e7eaf6');bg.addColorStop(1,'#faf9ff');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#9ca5bd55';for(let y=25;y<h;y+=20)for(let x=22;x<w;x+=20){ctx.beginPath();ctx.arc(x,y,1.15,0,Math.PI*2);ctx.fill();}
ctx.strokeStyle='#d52235';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,92,0,Math.PI*2);ctx.stroke();
ctx.strokeStyle='#ed3448';ctx.lineWidth=7;ctx.strokeRect(7,7,w-14,h-14);
ctx.fillStyle='#14121b';ctx.shadowColor='#f3283e';ctx.shadowBlur=12;ctx.fillRect(w*.34,0,w*.32,11);ctx.fillRect(w*.34,h-11,w*.32,11);ctx.shadowBlur=0;
const own=side<0?0:side;
game.paddles.forEach((p,i)=>{const x=p.y*w,y=(side===0?1-p.x:p.x)*h;const isOwn=i===own;const base=isOwn?'#0757e8':'#d51027';const light=isOwn?'#82d7ff':'#ffb3ba';ctx.save();ctx.shadowColor='#2228';ctx.shadowBlur=16;ctx.shadowOffsetY=9;ctx.fillStyle='#151625';ctx.beginPath();ctx.ellipse(x,y+17,52,24,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;const rim=ctx.createRadialGradient(x-17,y-24,3,x,y,53);rim.addColorStop(0,'#fff');rim.addColorStop(.23,light);rim.addColorStop(.67,base);rim.addColorStop(1,'#151a47');ctx.fillStyle=rim;ctx.beginPath();ctx.ellipse(x,y+5,53,38,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=light;ctx.lineWidth=7;ctx.stroke();ctx.fillStyle=base;ctx.beginPath();ctx.roundRect(x-23,y-46,46,51,16);ctx.fill();ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(x-9,y-34,12,7,-.4,0,Math.PI*2);ctx.fill();ctx.restore();});
const px=game.puck.y*w,py=(side===0?1-game.puck.x:game.puck.x)*h,r=31;ctx.save();
ctx.shadowColor='#11182766';ctx.shadowBlur=13;ctx.shadowOffsetY=7;ctx.fillStyle='#171717';ctx.beginPath();ctx.ellipse(px,py+6,r+1,r*.78,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
const rim=ctx.createLinearGradient(px-r,py-r,px+r,py+r);rim.addColorStop(0,'#252525');rim.addColorStop(.22,'#050505');rim.addColorStop(.55,'#3c3c3c');rim.addColorStop(1,'#070707');ctx.fillStyle=rim;ctx.beginPath();ctx.ellipse(px,py+4,r,r*.8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#050505';ctx.lineWidth=3;ctx.stroke();
const face=ctx.createRadialGradient(px-11,py-14,2,px,py,r);face.addColorStop(0,'#fff9a2');face.addColorStop(.28,'#ffeb46');face.addColorStop(.72,'#f6c500');face.addColorStop(1,'#c88b00');ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(px,py-3,r-3,r*.71,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111111';ctx.lineWidth=3.5;ctx.stroke();ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(px-11,py-14,8,3.5,-.3,0,Math.PI*2);ctx.fill();ctx.restore();drawGoalFx();drawWinFx();}
function drawGoalFx(){if(!goalFx)return;const elapsed=performance.now()-goalFx.start;if(elapsed>1450){goalFx=null;return;}const t=elapsed/1450,alpha=Math.min(1,t/.13, (1-t)/.27),w=600,h=880,top=goalFx.end==='top';ctx.save();ctx.globalAlpha=Math.max(0,alpha);ctx.shadowBlur=32;ctx.shadowColor='#ed102e';ctx.strokeStyle='#ed102e';ctx.lineWidth=10*(1-t)+3;ctx.strokeRect(w*.34,top?4:h-28,w*.32,24);
// The goal net drops only after a score, then retracts and disappears.
const ease=x=>1-Math.pow(1-x,3);
const drop=t<.22?ease(t/.22):t<.62?1:Math.max(0,1-ease(Math.min(1,(t-.62)/.22)));
if(drop>0){const netW=w*.32,netH=86*drop,left=w*.34,origin=top?0:h;
ctx.save();ctx.beginPath();ctx.rect(left,top?0:h-netH,netW,netH);ctx.clip();
ctx.fillStyle='#111a25c9';ctx.fillRect(left,top?0:h-netH,netW,netH);
ctx.strokeStyle='#f2f5fa';ctx.lineWidth=2.3;ctx.shadowBlur=3;ctx.shadowColor='#fff8';
for(let x=left;x<=left+netW+1;x+=21){ctx.beginPath();ctx.moveTo(x,top?0:h-netH);ctx.lineTo(x,top?netH:h);ctx.stroke();}
for(let y=0;y<=86;y+=17){const yy=top?y:h-y;if((top&&yy>netH)||(!top&&yy<h-netH))continue;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(left+netW,yy);ctx.stroke();}
ctx.restore();}
ctx.translate(w/2,h/2);const scale=.55+Math.min(1,t/.28)*.65+Math.sin(t*25)*.045;ctx.scale(scale,scale);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 100px Arial';ctx.lineWidth=9;ctx.strokeStyle='#ffffff';ctx.strokeText('GOAL!',0,0);ctx.shadowBlur=25;ctx.shadowColor='#e00025';ctx.fillStyle='#ed1235';ctx.fillText('GOAL!',0,0);ctx.restore();}
function goalAnimation(){if(!goalFx)return;draw();if(goalFx)requestAnimationFrame(goalAnimation);}
function drawWinFx(){if(!winFx)return;const t=(performance.now()-winFx.start)/4500;if(t>=1){winFx=null;return;}const w=600,h=880,fade=Math.min(1,t*5,(1-t)*4);ctx.save();ctx.globalAlpha=Math.max(0,fade);ctx.fillStyle='#0d0922bb';ctx.fillRect(0,0,w,h);for(let i=0;i<65;i++){const x=(i*137.7+Math.sin(i*5)*80)%w,y=((i*103+t*750)%h+h)%h;ctx.fillStyle=['#ffca4b','#fa385b','#5bdfff','#ffffff'][i%4];ctx.save();ctx.translate(x,y);ctx.rotate(t*8+i);ctx.fillRect(-5,-9,10,18);ctx.restore();}ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#ffca44';ctx.shadowBlur=28;ctx.font='bold 95px Arial';ctx.fillText('🏆',w/2,h*.33);ctx.font='bold 60px Tahoma,Arial';ctx.fillStyle='#ffe7a1';ctx.fillText('الفائز!',w/2,h*.48);ctx.font='bold 36px Tahoma,Arial';ctx.fillStyle='#fff';ctx.fillText(winFx.winner||'الفائز',w/2,h*.57);ctx.restore();}
