<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO | SARA</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 15%,#542344,#170a22 65%,#09030c);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:#ffe4a0;background:linear-gradient(#512044,#1c1026);border:1.5px solid #d7aa56;border-radius:14px;padding:12px 18px;box-shadow:0 3px 13px #0009}button:disabled{opacity:.4;cursor:not-allowed}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;flex-wrap:wrap}.brand{font: bold 34px Georgia,serif;color:#eecb75;text-shadow:0 0 15px #b57d33}.logo{font:bold italic 43px Arial;color:#ffde53;text-shadow:3px 4px #a70000,0 0 20px #ff3c00}.modal{max-width:430px;margin:6vh auto;padding:25px;background:#21112edb;border:2px solid #b28b51;border-radius:22px;text-align:center;box-shadow:0 0 45px #e0a34438}.modal input,.modal select{width:100%;padding:13px;margin:7px 0;background:#130d1b;color:#fff;border:1px solid #b98c57;border-radius:12px}.modal button{width:100%;margin-top:12px}.hint{color:#d8bf9b;font-size:13px}#error{color:#ff8c9c}.table{position:relative;margin:12px auto 0;width:min(96vw,1050px);min-height:530px;border:9px ridge #d5a44c;border-radius:48% / 32%;background:radial-gradient(ellipse,#411537 0%,#230e29 70%,#11091a);box-shadow:0 0 0 6px #4c2537,0 0 55px #b16e2955;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}.players{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px}.player{border:1px solid #9d794c;background:#160c1bc9;border-radius:16px;padding:9px 15px;min-width:130px;text-align:center}.player.active{box-shadow:0 0 20px #f4cb51;border-color:#ffd971}.player.mine{color:#ffe18a}.center{display:flex;align-items:center;justify-content:center;gap:25px}.card{position:relative;width:96px;height:148px;border-radius:13px;border:7px solid #fff;box-shadow:4px 7px 10px #0008;display:flex;align-items:center;justify-content:center;flex-shrink:0;font:bold 52px Arial;color:white;text-shadow:2px 3px #0006;transform:rotate(-3deg);user-select:none}.card:before{content:'';position:absolute;inset:14px 7px;border:5px solid #fff9;border-radius:55%;transform:rotate(-25deg)}.card span{position:relative;z-index:1}.card.red{background:#e42327}.card.blue{background:#0875d9}.card.green{background:#139a51}.card.yellow{background:#e5ae08}.card.wild{background:conic-gradient(#e42327 0 25%,#0875d9 25% 50%,#139a51 50% 75%,#e5ae08 75%)}.card.back{background:#111;color:#ffd242;font-size:30px;border-color:#e6e3db;transform:rotate(4deg)}.card.back:before{border:5px solid #e83c24;transform:rotate(-22deg)}.card.playable{cursor:pointer;transition:transform .15s}.card.playable:hover{transform:translateY(-18px) rotate(0deg);box-shadow:0 0 20px #eebf54}.hand{display:flex;justify-content:center;align-items:end;overflow-x:auto;padding:20px 8px 32px;min-height:195px;max-width:100vw}.hand .card{margin-left:-20px;width:82px;height:128px;font-size:42px}.hand .card:first-child{margin-left:0}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px}.status{text-align:center;color:#f5d18c;font-weight:bold;padding:10px}.colorPicker{display:flex;gap:10px;justify-content:center;margin:12px}.colorPicker button{width:48px;height:48px;border-radius:50%;padding:0;border:3px solid #fff}.overlay{position:fixed;inset:0;background:#000b;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}.overlay[hidden],[hidden]{display:none!important}.winner{font-size:clamp(28px,7vw,70px);color:#ffe28c;text-shadow:0 0 30px #ffbd35;text-align:center;animation:pulse .6s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.confetti{position:fixed;top:-30px;animation:fall 3s linear forwards;z-index:8;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(1000deg);opacity:0}}@media(max-width:650px){.table{min-height:360px;border-radius:35% / 23%;border-width:5px}.card{width:72px;height:110px;font-size </style></head><body><div class="top"><a href="/" style="color:#f2d38b">↩ مجلس سارة</a><div class="brand">♛ SARA ♛</div><button id="sound">🔊 الصوت شغال</button></div><div style="text-align:center" class="logo">UNO</div><section id="login" class="modal"><h2>🎟️ دخول لعبة UNO</h2><input id="name" placeholder="اسم اللاعب" maxlength="24"><input id="secret" placeholder="رمز الزائر أو كلمة مرور المجلس" type="password"><button id="enter">دخول للطاولة</button><p class="hint">تقدر تدخل برمز الزائر لمرة واحدة أو بكلمة مرور المجلس</p><p id="error"></p></section><section id="lobby" class="modal" hidden><h2>اختر عدد اللاعبين</h2><button id="two">👥 لاعبان</button><button id="four">👑 أربعة لاعبين</button><p class="hint">تبدأ الجولة تلقائيًا عند اكتمال اللاعبين</p></section><section id="game" hidden><div class="players" id="players"></div><div class="table"><div class="status" id="status"></div><div class="center"><div class="card back" id="deck"><span>UNO</span></div><div class="card red" id="discard"><span>7</span></div></div><div id="colorName" class="status"></div><div id="log" class="hint"></div></div><div class="controls"><button id="draw">🃏 سحب ورقة</button><button id="uno" style="background:linear-gradient(#e52226,#78040d);font-size:22px;font-weight:bold">🔔 UNO!</button><button id="leave">مغادرة الطاولة</button></div><div class="hand" id="hand"></div></section><div id="pick" class="overlay" hidden><div class="modal"><h2>اختر اللون</h2><div class="colorPicker"><button style="background:#e42327" data-color="red"></button><button style="background:#0875d9" data-color="blue"></button><button style="background:#139a51" data-color="green"></button><button style="background:#e5ae08" data-color="yellow"></button></div><button id="cancel">إلغاء</button></div></div><div id="win" class="overlay" hidden><div><div class="winner" id="winnerText"></div><div style="text-align:center;margin:25px"><button id="closeWin">🎉 إغلاق الاحتفال</button></div></div></div><script src="/socket.io/socket.
