<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIC | ماجيك</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#7b246c,#170b29 75%);color:white;font-family:Tahoma,Arial;text-align:center}header{padding:13px;background:#210d32;border-bottom:2px solid #d5a54e;display:flex;align-items:center;justify-content:space-between;gap:8px}button,select{font:inherit;border:1px solid #e4bc72;border-radius:12px;background:#5b215d;color:#fff;padding:9px;cursor:pointer}h1{font-size:26px;margin:10px;color:#ffe19b}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px}.stats span{background:#321c4c;border:1px solid #a776ce;border-radius:12px;padding:10px}#board{width:min(94vw,490px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:auto;padding:8px;border:5px solid #e3b96d;border-radius:18px;background:#2e174c;box-shadow:0 0 28px #d959d8} .tile{padding:0;border:1px solid #ffffff55;background:linear-gradient(145deg,#9554a3,#4c2c77);border-radius:10px;display:grid;place-items:center;font-size:clamp(24px,7vw,43px);transition:transform .18s,filter .18s;text-shadow:0 2px 7px #0009}.tile.selected{transform:scale(1.12);box-shadow:0 0 18px 7px #ffe96c;z-index:2}.tile.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.4);filter:brightness(2)}}#message{min-height:35px;color:#ffe581;font-weight:bold;font-size:20px;margin:12px}#radio{max-width:490px;margin:14px auto;padding:12px;border:1px solid #d4a45c;border-radius:14px;background:#21132f}#radio a{color:#ffe49d}.sub{font-size:12px;color:#d9b7dd}#effects{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;animation:fly .7s forwards;font-size:24px}@keyframes fly{to{transform:translateY(-110px) scale(1.8);opacity:0}}@keyframes winPulse{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}#winOverlay{position:fi enter;font-size:13px;color:#ffe19b}#radioBahrainEmbed{margin:10px 0;border-radius:12px;overflow:hidden;background:white}#radioBahrainEmbed[hidden]{display:none}</style><header><a href="/?openGames=1" style="color:#ffe2a3;background:#653270;border:1px solid #e5bf79;padding:10px;border-radius:12px;text-decoration:none;font-weight:bold">↩ رجوع إلى ردهة الألعاب</a><strong>🍓 MAGIC</strong><div style="display:flex;gap:5px"><button id="radioToggle" type="button">📻 الراديو</button><button id="sound">🔊 المؤثرات</button></div></header><h1>🍓 MAGIC 🍇</h1><div class="stats"><span>المستوى <b id="level">1</b> / 500</span><span>النقاط <b id="score">0</b></span><span>الحركات <b id="moves">25</b></span><span>الهدف <b id="goal">600</b></span></div><div id="board"></div><div id="message">بدّل فاكهتين متجاورتين واجمع 3 أو أكثر!</div><button id="restart">🔄 إعادة المستوى</button> <button id="resetAll" style="background:#8a2443;border-color:#ffd17a">🏁 البدء من المستوى 1</button><section id="radioPanel" class="radioPanel" hidden><div class="radioHead"><strong>📻 راديو سارة</strong><button id="radioClose" type="button" aria-label="إغلاق">✕</button></div><div id="saraRadioArea"><p class="saraRadioHint">✨ اختر محطتك المفضلة</p><div id="radioVolumeControlTop"><div class="radioActions" id="radioActionsTop"><button id="radioPlay" type="button">▶ تشغيل</button><button id="radioStop" type="button">⏹ إيقاف</button><a id="radioExternal" href="https://mbcradios.net/" target="_blank" rel="noopener noreferrer">فتح موقع الإذاعة</a></div><label for="radioVolume">🔊 مستوى الصوت <span id="radioVolumeText">50%</span></label><input id="radioVolume" type="range" min="0" max="100" value="50"></div><div id="radioChoices" class="saraRadioChoices"></div><label for="radioStation" class="radioHiddenLabel">اختر الإذاعة</label><select id="radioStation" class="radioHiddenSelect"><option value="MBC FM">MBC FM</option><option value="Panorama FM">بانوراما FM</option><option value="Rotana FM">روتانا FM</option><option value= const worlds=[["🍓","🍊","🍇","🍉","🥝","🍋"],["🍬","🍭","🍩","🍫","🧁","🍪"],["💎","🔮","💠","🟢","🔷","🟣"]];let fruits=worlds[0];let level=Math.min(500,Math.max(1,Number(localStorage.getItem('saraFruitLevel')||1))),score=0,moves=25,board=[],selected=-1,busy=false,sound=true,ctx;const $=id=>document.getElementById(id),rand=()=>Math.floor(Math.random()*fruits.length),goal=()=>500+level*100;
function beep(f=500,d=.1){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,ctx.currentTime);g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}
function start(){fruits=worlds[Math.floor((level-1)/5)%3];document.body.style.background=['radial-gradient(circle at top,#7b246c,#170b29 75%)','radial-gradient(circle at top,#aa5c26,#30102f 75%)','radial-gradient(circle at top,#176f9b,#140c41 75%)'][Math.floor((level-1)/5)%3];score=0;moves=Math.max(14,26-Math.floor(level/30));board=Array.from({length:64},rand);while(matches().size)for(const i of matches())board[i]=rand();selected=-1;busy=false;draw();$('message').textContent='اجمع 3 فواكه أو أكثر 🍓'}
function matches(){let m=new Set;for(let y=0;y<8;y++)for(let x=0;x<8;x++){let i=y*8+x,v=board[i];if(v==null)continue;if(x<6&&board[i+1]===v&&board[i+2]===v){let k=x;while(k<8&&board[y*8+k]===v)m.add(y*8+k++)}if(y<6&&board[i+8]===v&&board[i+16]===v){let k=y;while(k<8&&board[k*8+x]===v)m.add(k++*8+x)}}return m}
function draw(){let b=$('board');b.innerHTML='';board.forEach((v,i)=>{let el=document.createElement('button');el.className='tile'+(selected===i?' selected':'');el.textContent=v==null?'':fruits[v];el.onclick=()=>choose(i);b.append(el)});$('level').textContent=level;$('score').textContent=score;$('moves').textContent=moves;$('goal').textContent=goal()}
const wait=t=>new Promise(r=>setTimeout(r,t));async function celebrate(n){$('winText').textContent='🔥 كفو عليك! اجتزت المستوى '+n+' بنجاح! 🔥';$('winOverlay').style.display='flex';[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.22),i*180));for(let i=0;i<40;i++){let sp=document.createElement('span');sp.className='spark';sp.textContent=['✨','🎊','⭐','💛'][i%4];sp.style.left=Math.random()*95+'vw';sp.style.top=(30+Math.random()*70)+'vh';$('effects').append(sp);setTimeout(()=>sp.remove(),900)}await new Promise(resolve=>{$('nextLevel').onclick=()=>{$('winOverlay').style.display='none';resolve()}})}function swap(a,b){[board[a],board[b]]=[board[b],board[a]]}
async function choose(i){if(busy)return;if(selected<0){selected=i;draw();return}let a=selected;selected=-1;if(a===i){draw();return}if(Math.abs(Math.floor(a/8)-Math.floor(i/8))+Math.abs(a%8-i%8)!==1){selected=i;draw();return}busy=true;swap(a,i);draw();await wait(170);if(!matches().size){swap(a,i);beep(180,.16);$('message').textContent='لازم تجمع 3 فواكه على الأقل';draw();busy=false;return}moves--;await resolve();if(score>=goal()){const finished=level;level=Math.min(500,level+1);localStorage.setItem('saraFruitLevel',level);await celebrate(finished);start()}else if(moves<=0){$('message').textContent='انتهت الحركات! أعد المحاولة';beep(180,.4);busy=false}else{busy=false;draw()}}
async function resolve(){let chain=0;while(true){let m=matches();if(!m.size)break;chain++;score+=m.size*25*chain;$('message').textContent=chain>1?'✨ كومبو رائع ×'+chain:'💥 انفجار الفواكه!';beep(380+chain*150,.18);for(let i of m){board[i]=null;let e=$('board').children[i];e.classList.add('pop');let r=e.getBoundingClientRect(),sp=document.createElement('span');sp.className='spark';sp.textContent='✨';sp.style.left=r.left+r.width/2+'px';sp.style.top=r.top+'px';$('effects').append(sp);setTimeout(()=>sp.remove(),800)}await wait(280);for(let x=0;x<8;x++){let vals=[];for(let y=7;y>=0;y--){let v=board[y*8+x];if(v!=null)vals.push(v)}for(let y=7;y>=0;y--)board[y*8+x]=vals[7-y]??rand()}draw();await wait(220)}draw()}
$('restart').onclick=start;$('resetAll').onclick=()=>{if(!confirm('⚠️ هل أنت متأكد أنك تريد العودة إلى المستوى 1؟\nسيتم مسح تقدمك في المستويات السابقة ولا يمكن التراجع.'))return;localStorage.removeItem('saraFruitLevel');level=1;start();$('message').textContent='🎮 بدأت من المستوى الأول! بالتوفيق!'};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 المؤثرات':'🔇 المؤثرات'};start();
