<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلم والثعبان | مجلس سارة</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#54215c,#180e24 70%);color:#ffe7b2;font-family:Tahoma,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#190d22bb;border-bottom:2px solid #b88b4c}h1{margin:0;font-size:clamp(19px,3vw,31px);text-align:center}button,input{font:inherit;border-radius:12px;padding:12px}button{background:linear-gradient(#f8d991,#aa6c21);color:#241126;border:1px solid #ffe7aa;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input{background:#2d1738;color:white;border:1px solid #a77b48;width:100%;margin-bottom:9px}.wrap{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:230px 1fr 240px;gap:16px}.panel{background:#27132dcc;border:1px solid #b88b4c;border-radius:18px;padding:16px;box-shadow:0 8px 30px #0005}.panel h3{margin-top:0}.board{width:min(100%,720px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:12px ridge #c99546;border-radius:15px;position:relative;box-shadow:0 15px 35px #0008}.cell{position:relative;display:flex;justify-content:center;align-items:flex-start;padding:4px;font-weight:900;font-size:clamp(10px,1.5vw,19px);color:#e5bb73;background:#331940;border:1px solid #ad844d55}.cell:nth-child(even){background:#f4dec1;color:#5a2d3d}.cell span{position:absolute;bottom:4%;font-size:clamp(13px,2vw,27px);filter:drop-shadow(0 2px 2px #0008)}.pieces{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;flex-wrap:wrap}.piece{font-size:clamp(12px,2vw,24px);text-shadow:0 2px 5px #000}.turn{box-shadow:0 0 18px #ffcf4d;border-color:#ffe9a2!important}.player{padding:11px;margin:9px 0;border:1px solid #76526b;border-radius:12px}.gold{color:#ffd36c}.hint{font-size:12px;opacity:.8;line-height:1.7}.action{width:100%;margin:10px 0}.log{line-height:2}.rooms button{width:100%;margin:5px 0;font-size:13px}.footer{text-align:center;padding:12px}.hidden{display:none}@media(max-width:850px){.wrap{grid-template-columns:1fr}.board{border-width:6px}.panel{order:2}.center{order:1}header{padding:10px}}
</style></head><body><header><button onclick="location.href='/'">✕ رجوع</button><h1>♛ مجلس سارة ♛<br><small>السلم والثعبان الملكية</small></h1><span>🎲 Room Sarah</span></header><main class="wrap"><aside class="panel"><h3>👑 اللاعبون</h3><div id="players">بانتظار اللاعبين</div><p class="hint">2 إلى 4 لاعبين • مشاهدون • طاولات متعددة</p></aside><section class="center"><div class="board" id="board"></div><div class="panel" style="margin-top:14px;text-align:center"><div id="status">اختر طاولة أو أنشئ طاولة جديدة</div><button class="action" id="roll" disabled>🎲 ارْمِ النرد</button><button id="start" class="hidden">▶ ابدأ اللعبة</button><div id="last" class="log"></div></div></section><aside class="panel"><h3>🏰 الطاولات المباشرة</h3><input id="name" placeholder="اسم اللاعب" maxlength="22"><button class="action" id="create">+ إنشاء طاولة</button><button class="action" id="refresh">تحديث الطاولات</button><div id="rooms" class="rooms"></div><p class="hint">يمكنك الانضمام كلاعب قبل البداية أو المشاهدة بدون دخول اللعب.</p><div id="myRoom" class="gold"></div></aside></main><div class="footer">Room Sarah • Royal Snakes & Ladders</div><script src="/socket.io/socket.io.js"></script><script>
const s=io('/snakes'),colors=['🔴','🔵','🟡','🟢'];let me=null,state=null;const $=id=>document.getElementById(id);
const ladders={3:22,8:30,20:41,28:55,36:57,51:72,71:92,80:99},snakes={17:7,34:12,48:26,62:19,64:60,79:43,87:54,93:73,98:78};
const board=$('board');for(let row=9;row>=0;row--){for(let col=0;col<10;col++){const n=row*10+(row%2===0?col+1:10-col);const d=document.createElement('div');d.className='cell';d.dataset.n=n;d.innerHTML=n+'<span>'+(ladders[n]?'🪜':snakes[n]?'🐍':'')+'</span><div class="pieces"></div>';board.append(d)}}
function name(){return $('name').value.trim()||localStorage.getItem('saraUsername')||localStorage.getItem('saraName')||'ضيف'}
$('create').onclick=()=>s.emit('create',{name:name()});$('refresh').onclick=()=>s.emit('list');$('start').onclick=()=>s.emit('start');$('roll').onclick=()=>s.emit('roll');
s.on('joined',x=>{me=x;$('myRoom').textContent='رقم طاولتك: '+x.id});
s.on('rooms',rs=>{$('rooms').replaceChildren();rs.forEach(r=>{const d=document.createElement('div');d.className='player';const t=document.createElement('div');t.textContent='طاولة '+r.id+' • '+r.count+'/4 • 👁 '+r.viewers+(r.status==='playing'?' • 🔴 مباشر':'');d.append(t);for(const [label,watch] of [['انضم',false],['شاهد',true]]){const b=document.createElement('button');b.textContent=label;b.style.margin='4px';b.onclick=()=>s.emit('join',{id:r.id,name:name(),watch});d.append(b)}$('rooms').append(d)})});
s.on('state',r=>{if(me?.id!==r.id)return;state=r;document.querySelectorAll('.pieces').forEach(e=>e.replaceChildren());r.players.forEach((p,i)=>{if(p.pos){const cell=document.querySelector('[data-n="'+p.pos+'"] .pieces');if(cell){const piece=document.createElement('span');piece.className='piece';piece.textContent=colors[i];piece.title=p.name;cell.append(piece)}}});$('players').replaceChildren();r.players.forEach((p,i)=>{const d=document.createElement('div');d.className='player '+(r.turn===i&&r.status==='playing'?'turn':'');d.textContent=colors[i]+' '+p.name+' — خانة '+p.pos;$('players').append(d)});const mine=r.players.findIndex(p=>p.id===me.playerId),isTurn=r.status==='playing'&&r.turn===mine;$('roll').disabled=!isTurn;$('start').classList.toggle('hidden',r.status!=='waiting'||mine!==0||r.players.length<2);$('status').textContent=r.status==='finished'?'🏆 الفائز: '+r.winner:r.status==='waiting'?'بانتظار بدء اللعبة':isTurn?'✨ دورك الآن — ارمِ النرد':'الدور على '+r.players[r.turn]?.name;$('last').textContent=r.last?'🎲 '+r.last.player+' رمى '+r.last.dice+' وانتقل إلى '+r.last.to+(r.last.type==='ladder'?' 🪜 صعد السلم':r.last.type==='snake'?' 🐍 نزل مع الثعبان':''):''});
s.on('errorMsg',x=>alert(x));s.emit('list');
</script></body></html>
