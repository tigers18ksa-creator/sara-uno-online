<!doctype html><!-- Snakes and Ladders animated dice and step movement release --><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>السلم والثعبان | مجلس سارة</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e4;color:#143b2d;font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #c3a36b;border-radius:12px;background:#124936;color:white;padding:10px;font-weight:bold}button:disabled{opacity:.45}header{background:#103c30;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}header strong{font-size:clamp(14px,3vw,22px);text-align:center}header button{background:#1e6048}.wrap{max-width:1250px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:12px}.board{width:min(100%,850px);aspect-ratio:1;position:relative;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:6px solid #174c38;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px #2345;background:white;direction:ltr}.cell{position:relative;display:flex;justify-content:flex-start;align-items:flex-start;padding:2px 3px;border:1px solid #d5d9d1;background:#fff;color:#102c20;font-weight:900;text-shadow:0 1px 0 #fff;font-size:clamp(11px,2.6vw,21px);direction:ltr}.cell:nth-child(2n){background:#f8f9f5}.cell.ladder{background:#d8f2da}.cell.end{background:#f8e8ad}.cell .num{position:relative;z-index:2}.piece{position:absolute;inset:22% 0 0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vw,48px);z-index:4;filter:drop-shadow(0 2px 2px #666)}.piece.cpu{filter:hue-rotate(150deg) drop-shadow(0 2px 2px #666)}svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.side,.controls{background:white;border:1px solid #d9d5c9;border-radius:14px;padding:12px;box-shadow:0 4px 14px #1232}.side h3{margin:5px 0 12px}.side button{width:100%;margin:4px 0}.room{border-top:1px solid #ddd;padding:8px 0;font-size:13px}.room button{width:auto;font-size:12px;margin:4px}.controls{margin:10px auto;max-width:850px;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions button{min-width:120px}.muted{font-size:12px;color:#66796d}.status{font-weight:bold;margin:9px 0}.chat{display:none;position:fixed;z-index:20;top:64px;left:10px;width:min(320px,90vw);background:white;border:2px solid #124936;border-radius:14px;padding:12px;box-shadow:0 8px 25px #0004}.chat.open{display:block}.chat a{color:#124936}.radio{display:none;position:fixed;z-index:20;top:64px;right:10px;background:white;border:2px solid #124936;border-radius:14px;padding:12px;width:min(320px,90vw)}.radio.open{display:block}.radio audio{width:100%}.hidden{display:none!important}@media(max-width:740px){.wrap{grid-template-columns:1fr}.side{order:2}.board{border-width:4px}.side h3{font-size:15px}header{padding:8px}header button{font-size:12px;padding:8px}}
 .diceBox{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto}.die{width:66px;height:66px;background:#fffef6;color:#173d2e;border:3px solid #c6a15c;border-radius:14px;box-shadow:0 7px 12px #0003,inset 0 0 8px #dfd4b4;font-size:45px;display:grid;place-items:center;transform-style:preserve-3d}.die.rolling{animation:diceSpin 1.9s cubic-bezier(.22,.6,.15,1) both}@keyframes diceSpin{0%{transform:rotateX(0) rotateY(0) scale(1)}35%{transform:rotateX(520deg) rotateY(400deg) scale(1.14)}70%{transform:rotateX(790deg) rotateY(620deg) scale(1.08)}100%{transform:rotateX(1080deg) rotateY(720deg) scale(1)}}.movingSnake{position:absolute;z-index:8;font-size:clamp(26px,5.8vw,53px);width:10%;height:10%;display:grid;place-items:center;transition:left .36s ease-out,top .36s ease-out;pointer-events:none;filter:drop-shadow(0 3px 2px #2227);animation:snakeBounce .42s ease-in-out infinite alternate}@keyframes snakeBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-20%) rotate(5deg)}}.board{touch-action:pan-y}@media(max-width:740px){.wrap{padding:5px;gap:5px}.board{width:100%;border-width:3px}.cell{padding:2px}.controls{margin:7px 2px;padding:9px}.side{margin:4px}} </style></head><body><header><button onclick="location.href='/'">رجوع</button><button id="chatToggle">💬 الشات</button><strong>🐍 السلم والثعبان<br><small>Room Sarah</small></strong><button id="radioToggle">📻 الراديو</button></header><div class="chat" id="chat"><strong>شات مجلس سارة</strong><p class="muted">العودة للمجلس للمشاركة في الدردشة العامة.</p><a href="/">فتح المجلس</a><button onclick="document.getElementById('chat').classList.remove('open')">إغلاق</button></div><div class="radio" id="radio"><strong>الراديو</strong><p class="muted">التشغيل اختياري ومستقل لكل لاعب</p><audio controls preload="none" id="audio"></audio><button onclick="document.getElementById('radio').classList.remove('open')">إغلاق</button></div><main class="wrap"><section><div class="board" id="board"></div><div class="controls"><div class="status" id="status">اختر ضد الكمبيوتر أو أنشئ طاولة للانضمام</div><div class="diceBox"><div id="die" class="die" aria-label="النرد">⚀</div><strong id="diceLabel">جاهز للرمي</strong></div><div class="actions"><button id="create">👥 انضمام عضو</button><button id="computer">🤖 ضد الكمبيوتر</button><button id="start" class="hidden">▶ ابدأ اللعب</button><button id="roll" disabled>🎲 ارمِ النرد</button></div><p id="last" class="muted"></p><p id="roomId" class="muted"></p></div></section><aside class="side"><h3>👑 اللاعبون</h3><div id="players">بانتظار اللعب</div><h3>الطاولات المباشرة</h3><button id="refresh">تحديث الطاولات</button><div id="rooms"></div><p class="muted">لا حاجة لإدخال الاسم مرة ثانية. لاعبان لكل طاولة.</p></aside></main><script src="/socket.io/socket.io.js"></script><script>
const ladders={3:22,8:30,14:35,20:41,27:50,36:57,42:63,51:72,61:82,71:92,80:99,86:97},snakes={17:7,34:12,48:26,64:45,79:43,87:54,93:73,98:78};
const $=id=>document.getElementById(id),s=io('/snakes');let me=null,state=null,lastAt=0,audioCtx=null,animating=false,shownPositions={},animationQueue=Promise.resolve();const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function sound(kind){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='dice'?'triangle':'sine';o.frequency.setValueAtTime(kind==='dice'?170:kind==='up'?360:190,t);o.frequency.exponentialRampToValueAtTime(kind==='dice'?80:kind==='up'?690:100,t+.18);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.24)}catch(e){}}
function stepSound(){sound('up')}function userName(){return localStorage.getItem('saraUsername')||localStorage.getItem('saraName')||localStorage.getItem('saraUser')||'ضيف'}
function coords(n){const row=Math.floor((n-1)/10),col=(n-1)%10;return {x:(row%2===0?col:9-col)*10+5,y:(9-row)*10+5}}
const board=$('board');for(let row=9;row>=0;row--)for(let col=0;col<10;col++){const n=row*10+(row%2===0?col+1:10-col),d=document.createElement('div');d.className='cell'+(ladders[n]?' ladder':'')+(n===100?' end':'');d.dataset.n=n;d.innerHTML='<span class="num">'+(n===100?'100 🏆 النهاية':n)+'</span><div class="pieceSlot"></div>';board.append(d)}
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','paths');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');for(const [a,b] of Object.entries(ladders)){const p=coords(+a),q=coords(b),dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy),nx=-dy/len*.65,ny=dx/len*.65;for(let k of [-1,1]){const line=document.createElementNS(svg.namespaceURI,'line');for(const [attr,val] of Object.entries({x1:p.x+nx*k,y1:p.y+ny*k,x2:q.x+nx*k,y2:q.y+ny*k,stroke:'#b88a28','stroke-width':'.65','stroke-linecap':'round'}))line.setAttribute(attr,val);svg.append(line)}for(let t=0.08;t<.97;t+=.12){const l=document.createElementNS(svg.namespaceURI,'line');for(const [attr,val] of Object.entries({x1:p.x+dx*t-nx,y1:p.y+dy*t-ny,x2:p.x+dx*t+nx,y2:p.y+dy*t+ny,stroke:'#d2a53c','stroke-width':'.55'}))l.setAttribute(attr,val);svg.append(l)}}for(const [a,b] of Object.entries(snakes)){const p=coords(+a),q=coords(b),path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d','M '+p.x+' '+p.y+' Q '+(p.x+q.x)/2+6+' '+(p.y+q.y)/2+' '+q.x+' '+q.y);path.setAttribute('stroke','#b96551');path.setAttribute('stroke-width','1.1');path.setAttribute('fill','none');path.setAttribute('stroke-linecap','round');svg.append(path)}board.append(svg);
$('chatToggle').onclick=()=>$('chat').classList.toggle('open');$('radioToggle').onclick=()=>$('radio').classList.toggle('open');
$('create').onclick=()=>s.emit('create',{name:userName()});$('computer').onclick=()=>{if(!me){s.emit('create',{name:userName()});window.autoComputer=true}else s.emit('computer')};$('start').onclick=()=>s.emit('start');$('refresh').onclick=()=>s.emit('list');$('roll').onclick=()=>{if(animating)return;sound('dice');$('roll').disabled=true;s.emit('roll')};
s.on('joined',x=>{me=x;$('roomId').textContent='طاولة '+x.id;if(window.autoComputer){window.autoComputer=false;s.emit('computer')}});
s.on('rooms',rs=>{$('rooms').replaceChildren();for(const r of rs){const d=document.createElement('div');d.className='room';d.textContent='طاولة '+r.id+' • '+r.count+'/2 • 👁 '+r.viewers+' '+(r.status==='playing'?'🟢 مباشر':'');for(const [label,watch] of [['انضم',false],['شاهد',true]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>s.emit('join',{id:r.id,name:userName(),watch});d.append(b)}$('rooms').append(d)}});
function paintPieces(r,positions){document.querySelectorAll('.pieceSlot').forEach(e=>e.replaceChildren());r.players.forEach((p,i)=>{const pos=positions[p.id]??p.pos;if(!pos)return;const slot=document.querySelector('[data-n="'+pos+'"] .pieceSlot');if(slot){const d=document.createElement('div');d.className='piece'+(i?' cpu':'');d.textContent='🐍';d.title=p.name;slot.append(d)}})}
async function animateRoll(r){const roll=r.last;if(!roll||roll.at===lastAt)return;lastAt=roll.at;animating=true;$('roll').disabled=true;const die=$('die');die.classList.remove('rolling');void die.offsetWidth;die.classList.add('rolling');$('diceLabel').textContent='النرد يدور...';for(let i=0;i<14;i++){die.textContent=faces[Math.floor(Math.random()*6)];if(i%3===0)sound('dice');await wait(135)}die.classList.remove('rolling');die.textContent=faces[roll.dice-1];$('diceLabel').textContent='طلع الرقم '+roll.dice;await wait(320);
const player=r.players.find(p=>p.name===roll.player);if(player){const from=roll.from||0;const mover=document.createElement('div');mover.className='movingSnake';mover.textContent='🐍';board.append(mover);const setPos=n=>{const p=coords(Math.max(1,n));mover.style.left=(p.x-5)+'%';mover.style.top=(p.y-5)+'%'};setPos(from||1);await wait(80);for(let n=from+1;n<=roll.landing;n++){setPos(n);sound('up');await wait(430)}if(roll.to!==roll.landing){$('diceLabel').textContent=roll.type==='ladder'?'🪜 يصعد السلم':'🐍 ينزل';const a=coords(roll.landing),b=coords(roll.to);for(let i=1;i<=10;i++){mover.style.left=(a.x+(b.x-a.x)*i/10-5)+'%';mover.style.top=(a.y+(b.y-a.y)*i/10-5)+'%';if(i%2===0)sound(roll.type==='ladder'?'up':'down');await wait(190)}}mover.remove();shownPositions[player.id]=roll.to}paintPieces(r,shownPositions);animating=false;refreshTurn(r)}
function refreshTurn(r){const mine=r.players.findIndex(p=>p.id===me?.playerId),turn=r.status==='playing'&&mine===r.turn;$('roll').disabled=!turn||animating;$('status').textContent=r.status==='finished'?'🏆 الفائز '+r.winner:r.status==='waiting'?'بانتظار اللاعب الثاني':turn?'دورك الآن — ارمِ النرد':'الدور على '+(r.players[r.turn]?.name||'اللاعب')}
s.on('state',r=>{if(me?.id!==r.id)return;state=r;const previous={...shownPositions};r.players.forEach(p=>{if(shownPositions[p.id]===undefined)shownPositions[p.id]=p.pos});$('players').replaceChildren();r.players.forEach((p,i)=>{const d=document.createElement('p');d.textContent=(i?'🔵 ':'🟢 ')+p.name+' — '+p.pos;$('players').append(d)});const mine=r.players.findIndex(p=>p.id===me.playerId);$('start').classList.toggle('hidden',!(r.status==='waiting'&&mine===0&&r.players.length===2));$('create').disabled=!!me;$('computer').disabled=!!me&&r.players.length>1;$('last').textContent=r.last?'🎲 '+r.last.player+' رمى '+r.last.dice+' • '+r.last.landing+(r.last.type==='ladder'?' 🪜 صعود إلى '+r.last.to:r.last.type==='snake'?' 🐍 نزول إلى '+r.last.to:''):'';paintPieces(r,previous);if(r.last?.at&&r.last.at!==lastAt){animationQueue=animationQueue.then(()=>animateRoll(r)).catch(()=>{animating=false;refreshTurn(r)})}else refreshTurn(r)});
s.on('errorMsg',x=>alert(x));s.emit('list');
</script></body></html>
