button></div><div id="rooms"></div></section><section id="detail" hidden><div class="toolbar"><button id="leave">↩ العودة للصالة</button><button id="botInside" hidden>🤖 العب ضد الكمبيوتر</button><h2 id="roomTitle"></h2></div><div class="board"><div id="dominoHud"><div class="hudStat" id="scoreBox"><span>القيد</span><strong id="hudScore">0 - 0</strong></div><div class="hudOpponent"><div class="hudAvatar">🤖</div><strong id="hudOpponent">الكمبيوتر</strong></div><div class="hudStat"><span>باقي الأحجار</span><strong id="hudStock">14</strong></div></div><p id="status"></p><p id="players"></p><p id="watchers"></p><p id="score" hidden></p><div id="board" class="tiles"></div><p id="info" class="muted"></p><div id="dominoSelf"><div class="selfAvatar">👑</div><strong id="hudSelf">اللاعب</strong></div><div id="hand" class="tiles"></div><div id="dominoActions"><button id="draw" hidden>🁣 اسحب حجر / مرور</button><button id="passDomino">⏭ مرور</button><button id="sortDomino">⇅ ترتيب</button></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>const $=id=>document.getElementById(id),s=io('/salon');let game='pool',rooms=[],current=null,hand=[],seat=-1,mute=false,entered=false,sortHand=false;const names={pool:'البلياردو',domino:'الدومينو',baloot:'البلوت'};function beep(){if(mute)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13)}catch(e){}}function note(t){$('notice').textContent=t;setTimeout(()=>{$('notice').textContent=''},3500)}function render(){document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===game));$('heading').textContent='طاولات '+names[game];$('rooms').replaceChildren();$('bot').hidden=game!=='domino';const rs=rooms.filter(r=>r.game===game);if(!rs.length)$('rooms').textContent='لا توجد طاولات حاليًا — أنشئ أول طاولة';rs.forEach(r=>{const d=document.createElement('div');d.className='room';const t=document.createElement('div');t.textContent='🎮 '+r.id+' — '+r.players.join('، ');const sub=document.createElement('small');sub.textContent=' | '+r.players.length+'/'+(r.game==='pool'||r.game==='domino'?2:4)+' لاعبين • 👁 '+r.watchers+' مشاهد';t.append(sub);d.append(t);const a=document.createElement('div');a.className='actions';const join=document.createElement('button');join.textContent='انضم للعب';join.disabled=r.players.length>=(r.game==='pool'?2:4);join.onclick=()=>s.emit('salonJoin',{id:r.id,watch:false});const watch=document.createElement('button');watch.textContent='👁 شاهد';watch.onclick=()=>s.emit('salonJoin',{id:r.id,watch:true});a.append(join,watch);d.append(a);$('rooms').append(d)})}function dominoTile(el,t){el.classList.add('tile');el.setAttribute('aria-label','حجر '+t[0]+' و '+t[1]);el.replaceChildren();const layouts=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];for(let j=0;j<2;j++){const half=document.createElement('span');half.className='half';for(let k=0;k<9;k++){const cell=document.createElement('span');if(layouts[t[j]].includes(k))cell.className='pip';half.append(cell)}el.append(half);if(!j){const split=document.createElement('span');split.className='split';el.append(split)}}}function show(r){current=r;$('lobby').hidden=true;$('detail').hidden=false;$('roomTitle').textContent=names[r.game]+' — '+r.id;$('status').textContent=r.status==='waiting'?'بانتظار اكتمال اللاعبين':r.status==='finished'?'انتهت المباراة':'المباراة جارية';const max=r.game==='pool'||r.game==='domino'?2:4;if(r.game==='domino'){$('hudScore').textContent=(r.score?.[0]||0)+' - '+(r.score?.[1]||0);$('hudStock').textContent=r.stock??0;$('hudOpponent').textContent=r.players[1]||'بانتظار لاعب';$('hudSelf').textContent=r.players[seat>=0?seat:0]||'اللاعب'}document.body.classList.toggle('domino-mode',r.game==='domino');$('botIns l,downX=0,downY=0;const cleanup=()=>{$('board').classList.remove('drop-ready');ghost?.remove();ghost=null;dragging=false;b.classList.remove('dragging')};b.addEventListener('pointerdown',e=>{if(b.disabled)return;downX=e.clientX;downY=e.clientY;dragging=false;b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!b.hasPointerCapture(e.pointerId)||b.disabled)return;if(!dragging&&Math.hypot(e.clientX-downX,e.clientY-downY)>7){dragging=true;ghost=b.cloneNode(true);ghost.classList.add('domino-ghost');document.body.append(ghost);b.classList.add('dragging')}if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const rect=$('board').getBoundingClientRect();$('board').classList.toggle('drop-ready',e.clientX>=rect.left-40&&e.clientX<=rect.right+40&&e.clientY>=rect.top-65&&e.clientY<=rect.bottom+65)}});b.addEventListener('pointerup',e=>{if(b.disabled)return;const moved=dragging;cleanup();if(moved){const rect=$('board').getBoundingClientRect();if(e.clientY<rect.top-65||e.clientY>rect.bottom+65||e.clientX<rect.left-45||e.clientX>rect.right+45){note('اسحب الحجر فوق الطاولة');return}const l=current.board?.[0]?.[0],rr=current.board?.at(-1)?.[1];const side=current.board?.length&&t.includes(l)&&!t.includes(rr)?'left':current.board?.length&&!t.includes(l)&&t.includes(rr)?'right':e.clientX<rect.left+rect.width/2?'left':'right';playDomino(i,side)}else{const left=current.board?.[0]?.[0],right=current.board?.at(-1)?.[1];const side=current.board?.length&&t.includes(left)&&!t.includes(right)?'left':'right';playDomino(i,side)}});b.addEventListener('pointercancel',cleanup);$('hand').append(b)})}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;render()});$('enter').onclick=()=>s.emit('salonEnter',$('name').value);$('create').onclick=()=>{if(!entered)return note('ادخل باسمك أولًا');s.emit('salonCreate',game)};$('refresh').onclick=()=>s.emit('salonList');$('bot').onclick=()=>{if(!entered)return note('اكتب اسمك أولًا');s
