<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالة ألعاب سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4c294b,#100e19 75%);color:#f9e6ba;font-family:system-ui}header{text-align:center;padding:18px;border-bottom:1px solid #c59b51}h1{margin:0;font-size:clamp(22px,5vw,36px)}main{max-width:1050px;margin:auto;padding:16px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game,.room,.board{background:linear-gradient(140deg,#302032,#14111d);border:1px solid #b38b4a;border-radius:16px;padding:16px}.game{cursor:pointer;text-align:center;font-size:clamp(16px,3vw,23px)}.game.active{outline:2px solid #eac879}.game span{display:block;font-size:50px}button,input{font:inherit;border-radius:10px;padding:10px;background:#4d3054;color:#fff0ca;border:1px solid #c6a36b;cursor:pointer}button:disabled{opacity:.45}input{width:100%;max-width:250px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.room{margin:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.room small{color:#bfb0bb}.actions{display:flex;gap:7px}.board{text-align:center;min-height:180px}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:18px}.tile{background:#e8dbbb;color:#1b1820;border:2px solid #a99264;font-size:20px;min-width:52px;padding:14px 8px}.tile:disabled{opacity:.6}.muted{color:#d0bfc9}#detail[hidden],#lobby[hidden]{display:none}body.focused-game .games{display:none}body.focused-game:has(#detail:not([hidden]))>header p{display:none}body:has(#detail:not([hidden])) #name,body:has(#detail:not([hidden])) #enter{display:none}body.domino-mode .board{background:repeating-linear-gradient(110deg,#633718,#633718 9px,#6d3e20 12px,#5c3017 23px);border:9px ridge #a77536;box-shadow:inset 0 0 40px #1b0c06,0 15px 35px #100b0d;border-radius:26px;min-height:420px}body.domino-mode .tile{background:linear-gradient(125deg,#fff4dc,#e5d4b6);border:2px solid #8c6d4d;box-shadow:3px 5px 8px #1d0e08;border-radius:9px;color:#20170e;min-width:58px;min-height:84px;font-weight:bold;font-size:26px;transition:transform .25s ease}.tile:not(:disabled):hover{transform:translateY(-10px)}body.domino-mode #board{min-height:130px;align-items:center;align-content:center}body.domino-mode #hand{padding:16px;background:#24140980;border-radius:18px}#bot[hidden],#draw[hidden],#score[hidden]{display:none}body.focused-game header h1{font-size:clamp(22px,5vw,32px)}@media(max-width:450px){.games{gap:5px}.game{padding:10px}.game span{font-size:36px}}body.domino-mode .tile{display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:4px;width:52px;min-width:52px;height:100px;min-height:100px;flex-direction:column;background:linear-gradient(110deg,#fffaf0,#eee2cf 70%,#d3bda1);border:2px solid #bba78e;border-radius:9px;box-shadow:inset -3px -2px 5px #a68d7555,inset 2px 2px 3px #fff,3px 5px 6px #1c0d06;color:#17120f;transition:transform .2s ease,box-shadow .2s ease;animation:tileEnter .25s ease-out}body.domino-mode #board .tile{transform:rotate(-90deg);margin:0 22px;height:96px}body.domino-mode .tile .half{width:100%;height:45%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;gap:0}body.domino-mode .tile .pip{width:8px;height:8px;background:radial-gradient(circle at 32% 28%,#514c47,#0a0908 65%);border-radius:50%;box-shadow:inset 1px 1px 1px #000,1px 1px 1px #fff8}body.domino-mode .tile .split{width:90%;height:2px;background:#655547;box-shadow:0 1px 1px #fff}body.domino-mode #hand .tile{cursor:pointer}body.domino-mode #hand .tile:not(:disabled):hover{transform:translateY(-13px);box-shadow:0 13px 15px #140b09}@keyframes tileEnter{from{opacity:.5;scale:.86}to{opacity:1;scale:1}}@media(max-width:600px){body.domino-mode .tile{width:42px;min-width:42px;height:84px;min-height:84px;padding:3px}body.domino-mode .tile .pip{width:6px;height:6px}body.domino-mode #board .tile{margin:0 17px;height:80px}}body.domino-mode #hand .tile{touch-action:none;user-select:none;-webkit-user-select:none}body.domino-mode #hand .tile.dragging{opacity:.4}.domino-ghost{position:fixed!important;z-index:999999;pointer-events:none;transform:translate(-50%,-50%) rotate(-7deg)!important;opacity:.95;box-shadow:0 16px 24px #0008!important}body.domino-mode #board{outline:2px dashed #eac87955;outline-offset:5px}html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}body{display:flex;flex-direction:column}header{flex:0 0 auto;padding:8px 12px}header p{margin:4px 0}main{width:100%;max-width:1050px;min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden;padding:8px 12px}.toolbar{flex:0 0 auto;margin:6px 0;gap:6px}#lobby,#detail{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}#detail{display:flex;flex-direction:column}#detail[hidden]{display:none}#detail>.toolbar{flex:0 0 auto}#detail>.board{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;align-items:center;justify-content:space-between}body.domino-mode .board{min-height:0}body.domino-mode #board{flex:1;min-height:90px;margin:6px 0;overflow:auto;max-width:100%;align-content:center}body.domino-mode #hand{flex:0 0 auto;margin:6px 0;padding:8px;max-width:100%;max-height:35%;overflow:auto}body.domino-mode .tile{flex-shrink:0}#players,#status,#score,#watchers,#info{margin:4px 0}@media(max-width:600px){header h1{font-size:21px!important}header{padding:5px}main{padding:5px}body.domino-mode .board{border-width:5px;border-radius:14px}body.domino-mode #hand{max-height:39%}}</style></head><body><header><h1>♛ صالة ألعاب مجلس سارة ♛</h1><p>طاولات متعددة • مشاهدة مباشرة • أصوات مستقلة</p></header><main><div class="toolbar"><input id="name" placeholder="اسمك في المجلس" maxlength="24"><button id="enter">دخول الصالة</button><button id="sound">🔊 الصوت شغال</button><span id="notice"></span></div><div class="games"><button class="game active" data-game="pool"><span>🎱</span>بلياردو</button><button class="game" data-game="domino"><span>🁣</span>دومينو</button><button class="game" data-game="baloot"><span>♠️</span>بلوت</button></div><section id="lobby"><div class="toolbar"><h2 id="heading">طاولات البلياردو</h2><button id="create">+ طاولة جديدة</button><button id="refresh">↻ تحديث</button><button id="bot" hidden>🤖 العب ضد الكمبيوتر</button></div><div id="rooms"></div></section><section id="detail" hidden><div class="toolbar"><button id="leave">↩ العودة للصالة</button><button id="botInside" hidden>🤖 العب ضد الكمبيوتر</button><h2 id="roomTitle"></h2></div><div class="board"><p id="status"></p><p id="players"></p><p id="watchers"></p><p id="score" hidden></p><div id="board" class="tiles"></div><p id="info" class="muted"></p><div id="hand" class="tiles"></div><button id="draw" hidden>🁣 اسحب حجر / مرور</button></div></section></main><script src="/socket.io/socket.io.js"></script><script>const $=id=>document.getElementById(id),s=io('/salon');let game='pool',rooms=[],current=null,hand=[],seat=-1,mute=false,entered=false;const names={pool:'البلياردو',domino:'الدومينو',baloot:'البلوت'};function beep(){if(mute)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13)}catch(e){}}function note(t){$('notice').textContent=t;setTimeout(()=>{$('notice').textContent=''},3500)}function render(){document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===game));$('heading').textContent='طاولات '+names[game];$('rooms').replaceChildren();$('bot').hidden=game!=='domino';const rs=rooms.filter(r=>r.game===game);if(!rs.length)$('rooms').textContent='لا توجد طاولات حاليًا — أنشئ أول طاولة';rs.forEach(r=>{const d=document.createElement('div');d.className='room';const t=document.createElement('div');t.textContent='🎮 '+r.id+' — '+r.players.join('، ');const sub=document.createElement('small');sub.textContent=' | '+r.players.length+'/'+(r.game==='pool'||r.game==='domino'?2:4)+' لاعبين • 👁 '+r.watchers+' مشاهد';t.append(sub);d.append(t);const a=document.createElement('div');a.className='actions';const join=document.createElement('button');join.textContent='انضم للعب';join.disabled=r.players.length>=(r.game==='pool'?2:4);join.onclick=()=>s.emit('salonJoin',{id:r.id,watch:false});const watch=document.createElement('button');watch.textContent='👁 شاهد';watch.onclick=()=>s.emit('salonJoin',{id:r.id,watch:true});a.append(join,watch);d.append(a);$('rooms').append(d)})}function dominoTile(el,t){el.classList.add('tile');el.setAttribute('aria-label','حجر '+t[0]+' و '+t[1]);el.replaceChildren();const layouts=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];for(let j=0;j<2;j++){const half=document.createElement('span');half.className='half';for(let k=0;k<9;k++){const cell=document.createElement('span');if(layouts[t[j]].includes(k))cell.className='pip';half.append(cell)}el.append(half);if(!j){const split=document.createElement('span');split.className='split';el.append(split)}}}function show(r){current=r;$('lobby').hidden=true;$('detail').hidden=false;$('roomTitle').textContent=names[r.game]+' — '+r.id;$('status').textContent=r.status==='waiting'?'بانتظار اكتمال اللاعبين':r.status==='finished'?'انتهت المباراة':'المباراة جارية';const max=r.game==='pool'||r.game==='domino'?2:4;document.body.classList.toggle('domino-mode',r.game==='domino');$('botInside').hidden=r.game!=='domino'||r.bot||r.players.length>1;$('draw').hidden=r.game!=='domino'||r.status!=='playing';$('draw').disabled=r.turn!==seat;$('draw').textContent=r.stock?'🁣 اسحب حجر ('+r.stock+')':'⏭ مرور';$('score').hidden=r.game!=='domino';$('score').textContent='🏆 القيد: '+(r.score?.[0]||0)+' — '+(r.score?.[1]||0);const seats=Array.from({length:max},(_,i)=>r.players[i]?'👤 '+r.players[i]:'⏳ بانتظار لاعب');$('players').textContent='اللاعبون ('+r.players.length+'/'+max+'): '+seats.join('  |  ');$('watchers').textContent='👁 المشاهدون: '+r.watchers;$('board').replaceChildren();if(r.game==='domino'){r.board.forEach(t=>{const e=document.createElement('span');dominoTile(e,t);$('board').append(e)});$('info').textContent='العب الحجر المطابق للطرف، والفائز أول من ينهي أحجاره'}else $('info').textContent='معاينة الطاولة والمشاهدة متاحة. محرك اللعب الكامل لهذه اللعبة لم يكتمل بعد';drawHand()}function playDomino(i,side){if(!current||current.status!=='playing'||current.turn!==seat)return;const t=hand[i];if(!t)return;const left=current.board?.[0]?.[0],right=current.board?.at(-1)?.[1];if(current.board?.length){if(side==='left'&&!t.includes(left)){note('هذا الحجر لا يطابق الطرف الأيسر');return}if(side==='right'&&!t.includes(right)){note('هذا الحجر لا يطابق الطرف الأيمن');return}}s.emit('salonPlay',{tile:i,side});beep()}function drawHand(){$('hand').replaceChildren();if(!current||current.game!=='domino')return;hand.forEach((t,i)=>{const b=document.createElement('button');dominoTile(b,t);b.disabled=current.status!=='playing'||current.turn!==seat;b.title='اسحب الحجر إلى الطاولة أو اضغط عليه';let dragging=false,ghost=null,downX=0,downY=0;const cleanup=()=>{ghost?.remove();ghost=null;dragging=false;b.classList.remove('dragging')};b.addEventListener('pointerdown',e=>{if(b.disabled)return;downX=e.clientX;downY=e.clientY;dragging=false;b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!b.hasPointerCapture(e.pointerId)||b.disabled)return;if(!dragging&&Math.hypot(e.clientX-downX,e.clientY-downY)>9){dragging=true;ghost=b.cloneNode(true);ghost.classList.add('domino-ghost');document.body.append(ghost);b.classList.add('dragging')}if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});b.addEventListener('pointerup',e=>{if(b.disabled)return;const moved=dragging;cleanup();if(moved){const rect=$('board').getBoundingClientRect();if(e.clientY<rect.top-65||e.clientY>rect.bottom+65||e.clientX<rect.left-45||e.clientX>rect.right+45){note('اسحب الحجر فوق الطاولة');return}const side=e.clientX<rect.left+rect.width/2?'left':'right';playDomino(i,side)}else{const left=current.board?.[0]?.[0],right=current.board?.at(-1)?.[1];const side=current.board?.length&&t.includes(left)&&!t.includes(right)?'left':'right';playDomino(i,side)}});b.addEventListener('pointercancel',cleanup);$('hand').append(b)})}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;render()});$('enter').onclick=()=>s.emit('salonEnter',$('name').value);$('create').onclick=()=>{if(!entered)return note('ادخل باسمك أولًا');s.emit('salonCreate',game)};$('refresh').onclick=()=>s.emit('salonList');$('bot').onclick=()=>{if(!entered)return note('اكتب اسمك أولًا');s.emit('salonBot')};$('botInside').onclick=()=>s.emit('salonBot');$('draw').onclick=()=>s.emit('salonDraw');$('leave').onclick=()=>{s.emit('salonLeave');current=null;$('detail').hidden=true;$('lobby').hidden=false;render();note('تقدر تنضم لطاولة أخرى أو تنشئ طاولة جديدة')};$('sound').onclick=()=>{mute=!mute;$('sound').textContent=mute?'🔇 الصوت مكتوم':'🔊 الصوت شغال'};s.on('salonEntered',()=>{entered=true;$('enter').textContent='✓ تم الدخول';$('enter').disabled=true;note('جاري إدخالك مع اللاعبين تلقائيًا');s.emit('salonQuickJoin',game);beep()});s.on('salonError',note);s.on('salonList',v=>{rooms=v;render()});s.on('salonState',r=>{show(r);beep()});s.on('salonHand',v=>{hand=v.hand;seat=v.seat;drawHand()});const hash=new URLSearchParams(location.hash.slice(1));if(['pool','domino','baloot'].includes(hash.get('game'))){game=hash.get('game');document.body.classList.add('focused-game');document.querySelector('header h1').textContent='♛ '+names[game]+' — مجلس سارة';render()}if(hash.get('name')){$('name').value=hash.get('name')}s.on('connect',()=>{entered=false;$('enter').disabled=false;$('enter').textContent='دخول الصالة';if($('name').value.trim())s.emit('salonEnter',$('name').value);else s.emit('salonList')})</script></body></html>
