<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالة ألعاب سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4c294b,#100e19 75%);color:#f9e6ba;font-family:system-ui}header{text-align:center;padding:18px;border-bottom:1px solid #c59b51}h1{margin:0;font-size:clamp(22px,5vw,36px)}main{max-width:1050px;margin:auto;padding:16px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game,.room,.board{background:linear-gradient(140deg,#302032,#14111d);border:1px solid #b38b4a;border-radius:16px;padding:16px}.game{cursor:pointer;text-align:center;font-size:clamp(16px,3vw,23px)}.game.active{outline:2px solid #eac879}.game span{display:block;font-size:50px}button,input{font:inherit;border-radius:10px;padding:10px;background:#4d3054;color:#fff0ca;border:1px solid #c6a36b;cursor:pointer}button:disabled{opacity:.45}input{width:100%;max-width:250px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.room{margin:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.room small{color:#bfb0bb}.actions{display:flex;gap:7px}.board{text-align:center;min-height:180px}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:18px}.tile{background:#e8dbbb;color:#1b1820;border:2px solid #a99264;font-size:20px;min-width:52px;padding:14px 8px}.tile:disabled{opacity:.6}.muted{color:#d0bfc9}#detail[hidden],#lobby[hidden]{display:none}body.focused-game .games{display:none}body.focused-game header h1{font-size:clamp(22px,5vw,32px)}@media(max-width:450px){.games{gap:5px}.game{padding:10px}.game span{font-size:36px}}</style></head><body><header><h1>♛ صالة ألعاب مجلس سارة ♛</h1><p>طاولات متعددة • مشاهدة مباشرة • أصوات مستقلة</p></header><main><div class="toolbar"><input id="name" placeholder="اسمك في المجلس" maxlength="24"><button id="enter">دخول الصالة</button><button id="sound">🔊 الصوت شغال</button><span id="notice"></span></div><div class="games"><button class="game active" data-game="pool"><span>🎱</span>بلياردو</button><button class="game" data-game="domino"><span>🁣</span>دومينو</button><button class="game" data-game="baloot"><span>♠️</span>بلوت</button></div><section id="lobby"><div class="toolbar"><h2 id="heading">طاولات البلياردو</h2><button id="create">+ طاولة جديدة</button><button id="refresh">↻ تحديث</button></div><div id="rooms"></div></section><section id="detail" hidden><div class="toolbar"><button id="leave">↩ العودة للصالة</button><h2 id="roomTitle"></h2></div><div class="board"><p id="status"></p><p id="players"></p><p id="watchers"></p><div id="board" class="tiles"></div><p id="info" class="muted"></p><div id="hand" class="tiles"></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>const $=id=>document.getElementById(id),s=io('/salon');let game='pool',rooms=[],current=null,hand=[],seat=-1,mute=false,entered=false;const names={pool:'البلياردو',domino:'الدومينو',baloot:'البلوت'};function beep(){if(mute)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=520;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13)}catch(e){}}function note(t){$('notice').textContent=t;setTimeout(()=>{$('notice').textContent=''},3500)}function render(){document.querySelectorAll('[data-game]').forEach(b=>b.classList.toggle('active',b.dataset.game===game));$('heading').textContent='طاولات '+names[game];$('rooms').replaceChildren();const rs=rooms.filter(r=>r.game===game);if(!rs.length)$('rooms').textContent='لا توجد طاولات حاليًا — أنشئ أول طاولة';rs.forEach(r=>{const d=document.createElement('div');d.className='room';const t=document.createElement('div');t.textContent='🎮 '+r.id+' — '+r.players.join('، ');const sub=document.createElement('small');sub.textContent=' | '+r.players.length+'/'+(r.game==='pool'?2:4)+' لاعبين • 👁 '+r.watchers+' مشاهد';t.append(sub);d.append(t);const a=document.createElement('div');a.className='actions';const join=document.createElement('button');join.textContent='انضم للعب';join.disabled=r.players.length>=(r.game==='pool'?2:4);join.onclick=()=>s.emit('salonJoin',{id:r.id,watch:false});const watch=document.createElement('button');watch.textContent='👁 شاهد';watch.onclick=()=>s.emit('salonJoin',{id:r.id,watch:true});a.append(join,watch);d.append(a);$('rooms').append(d)})}function show(r){current=r;$('lobby').hidden=true;$('detail').hidden=false;$('roomTitle').textContent=names[r.game]+' — '+r.id;$('status').textContent=r.status==='waiting'?'بانتظار اكتمال اللاعبين':r.status==='finished'?'انتهت المباراة':'المباراة جارية';const max=r.game==='pool'?2:4;const seats=Array.from({length:max},(_,i)=>r.players[i]?'👤 '+r.players[i]:'⏳ بانتظار لاعب');$('players').textContent='اللاعبون ('+r.players.length+'/'+max+'): '+seats.join('  |  ');$('watchers').textContent='👁 المشاهدون: '+r.watchers;$('board').replaceChildren();if(r.game==='domino'){r.board.forEach(t=>{const e=document.createElement('span');e.className='tile';e.textContent=t.join(' | ');$('board').append(e)});$('info').textContent='العب الحجر المطابق للطرف، والفائز أول من ينهي أحجاره'}else $('info').textContent='معاينة الطاولة والمشاهدة متاحة. محرك اللعب الكامل لهذه اللعبة لم يكتمل بعد';drawHand()}function drawHand(){$('hand').replaceChildren();if(!current||current.game!=='domino')return;hand.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=t.join(' | ');b.disabled=current.status!=='playing'||current.turn!==seat;b.onclick=()=>{const side=current.board.length&&confirm('تضع الحجر في الطرف الأيسر؟')?'left':'right';s.emit('salonPlay',{tile:i,side});beep()};$('hand').append(b)})}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;render()});$('enter').onclick=()=>s.emit('salonEnter',$('name').value);$('create').onclick=()=>{if(!entered)return note('ادخل باسمك أولًا');s.emit('salonCreate',game)};$('refresh').onclick=()=>s.emit('salonList');$('leave').onclick=()=>{s.emit('salonLeave');current=null;$('detail').hidden=true;$('lobby').hidden=false;render();note('تقدر تنضم لطاولة أخرى أو تنشئ طاولة جديدة')};$('sound').onclick=()=>{mute=!mute;$('sound').textContent=mute?'🔇 الصوت مكتوم':'🔊 الصوت شغال'};s.on('salonEntered',()=>{entered=true;$('enter').textContent='✓ تم الدخول';$('enter').disabled=true;note('جاري إدخالك مع اللاعبين تلقائيًا');s.emit('salonQuickJoin',game);beep()});s.on('salonError',note);s.on('salonList',v=>{rooms=v;render()});s.on('salonState',r=>{show(r);beep()});s.on('salonHand',v=>{hand=v.hand;seat=v.seat;drawHand()});const hash=new URLSearchParams(location.hash.slice(1));if(['pool','domino','baloot'].includes(hash.get('game'))){game=hash.get('game');document.body.classList.add('focused-game');document.querySelector('header h1').textContent='♛ '+names[game]+' — مجلس سارة';render()}if(hash.get('name')){$('name').value=hash.get('name')}s.on('connect',()=>{entered=false;$('enter').disabled=false;$('enter').textContent='دخول الصالة';if($('name').value.trim())s.emit('salonEnter',$('name').value);else s.emit('salonList')})</script></body></html>
