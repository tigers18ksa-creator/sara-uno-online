<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fun Run — مجلس سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#63344d,#160d22 75%);color:#fff;font-family:system-ui,Tahoma;text-align:center;min-height:100dvh;padding:22px 12px}h1{color:#ffdc8a;text-shadow:0 0 14px #b4784d;font-size:clamp(28px,7vw,46px)}.wrap{max-width:820px;margin:auto}.panel{background:#251629;border:2px solid #d4a75d;border-radius:22px;padding:16px;box-shadow:0 10px 35px #0008}.track{margin:22px 0;direction:ltr;border-radius:15px;overflow:hidden;border:2px solid #bd9959}.lane{position:relative;height:83px;background:repeating-linear-gradient(90deg,#3c6849 0 65px,#447653 65px 130px);border-bottom:3px dashed #e7d4a8}.lane:nth-child(even){background:repeating-linear-gradient(90deg,#4b7653 0 65px,#54815a 65px 130px)}.runner{position:absolute;top:12px;left:2%;font-size:37px;transition:left .16s linear;filter:drop-shadow(0 4px 4px #000a)}.lane .name{position:absolute;top:4px;right:10px;direction:rtl;font-weight:800;background:#1d1424c9;padding:4px 9px;border-radius:9px;font-size:12px}.finish{position:absolute;right:5%;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,#fff 0 12px,#111 12px 24px)}button{border:2px solid #ffda86;border-radius:15px;background:linear-gradient(#b47b2b,#704016);color:#fff;font-size:20px;font-weight:800;padding:14px 22px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}#boost{width:min(100%,360px);padding:23px;font-size:24px;background:linear-gradient(#159ec3,#086187);box-shadow:0 0 18px #1ad6ff6b}#status{min-height:45px;font-weight:700;color:#ffe7ae}small{color:#d8c5d5}a{color:#ffda86}</style></head><body><div class="wrap"><h1>🏃‍♂️ Fun Run</h1><div class="panel"><p>سباق أربعة متسابقين — اضغط انطلق بسرعة لتسبق الكمبيوتر!</p><div id="status">اضغط ابدأ السباق</div><div class="track" id="track"></div><button id="start">🏁 ابدأ السباق</button> <button id="boost" disabled>⚡ انطلق!</button><p><small>نسخة تجريبية قابلة للعب ضد 3 متسابقين كمبيوتر. اللعب الجماعي المباشر لم يُفعّل بعد.</small></p></div></div><script>const track=document.getElementById('track'),status=document.getElementById('status'),start=document.getElementById('start'),boost=document.getElementById('boost');const names=['أنت','الكمبيوتر 1','الكمبيوتر 2','الكمبيوتر 3'],icons=['🏃‍♂️','🏃‍♀️','🦸','🏃'];let pos=[0,0,0,0],running=false,last=0,frame=0;function paint(){track.replaceChildren();names.forEach((n,i)=>{const lane=document.createElement('div');lane.className='lane';lane.innerHTML='<div class="finish"></div><span class="name"></span><span class="runner"></span>';lane.querySelector('.name').textContent=n;lane.querySelector('.runner').textContent=icons[i];lane.querySelector('.runner').style.left=(2+pos[i]*.9)+'%';track.append(lane)})}function end(i){running=false;boost.disabled=true;start.disabled=false;start.textContent='🔄 سباق جديد';status.textContent=i===0?'🏆 مبروك! أنت الفائز!':'🏁 فاز '+names[i]+' — جرّب مرة ثانية'}function tick(t){if(!running)return;const dt=Math.min((t-last)/1000,.08);last=t;for(let i=1;i<4;i++)pos[i]=Math.min(100,pos[i]+dt*(9.2+i*1.2+Math.random()*5));pos[0]=Math.min(100,pos[0]+dt*7);const winner=pos.findIndex(p=>p>=100);paint();if(winner>=0)return end(winner);frame=requestAnimationFrame(tick)}start.onclick=()=>{cancelAnimationFrame(frame);pos=[0,0,0,0];running=true;start.disabled=true;boost.disabled=false;status.textContent='انطلق! اضغط الزر الأزرق بسرعة';last=performance.now();paint();frame=requestAnimationFrame(tick)};boost.onclick=()=>{if(!running)return;pos[0]=Math.min(100,pos[0]+2.6);if(pos[0]>=100){paint();end(0)}};paint();</script></body></html>
