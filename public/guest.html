<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SARA | مشاهدة الألعاب</title><link rel="stylesheet" href="/guest.css?v=4"></head><body><main><header>♛ SARA <small>الألعاب للزوار</small></header><section id="guestLogin"><h1>🎟️ دخول زائر</h1><p>ادخل باسمك واستمتع بألعاب مجلس سارة دون الدخول إلى المحادثات.</p><div class="guestPhoto"><img id="guestAvatarPreview" alt="صورة الزائر" hidden><label for="guestAvatar">📷 اختر صورتك الشخصية</label><input id="guestAvatar" type="file" accept="image/png,image/jpeg,image/webp"></div><input id="guestName" maxlength="24" placeholder="اسم الزائر" autocomplete="off"><button id="guestEnter">دخول للألعاب</button><p id="guestError" role="alert"></p></section><section id="guestGames" hidden><div class="guestIdentity"><img id="guestProfile" alt="صورتك" hidden><h2 id="guestGreeting"></h2></div><p id="guestGateNotice" hidden>🔒 الألعاب مقفلة حاليًا من إدارة المجلس</p><nav id="guestGameNav"><button type="button" id="guestUno" onclick="location.href='/uno.html#ticket=guest&name='+encodeURIComponent(document.getElementById('guestName').value.trim())">🃏 UNO</button><button id="showSalon" type="button">🎱 بلياردو • 🁣 دومينو • ♠️ بلوت</button><button id="showXO">❌⭕ لعبة X O</button><button id="showC4">🔴🟡 لعبة 4 صف</button></nav><section id="xoGame" class="game"><h2>❌⭕ X O</h2><p id="xoPlayers"></p><p id="xoStatus"></p><div class="actions"><button id="xoJoin">الانضمام للعب</button><button id="xoLeave">مغادرة اللعبة</button><button id="xoRestart">إعادة المباراة</button></div><div id="xoBoard" class="xoBoard"></div><p id="xoViewers" class="viewers"></p></section><section id="c4Game" class="game" hidden><h2>🔴🟡 4 صف</h2><p id="c4Players"></p><p id="c4Status"></p><div class="actions"><button id="c4Join">الانضمام للعب</button><button id="c4Leave">مغادرة اللعبة</button><button id="c4Restart">إعادة المباراة</button></div><div id="c4Board" class="c4Board"></div><p id="c4Viewers" class="viewers"></p></section><section id="guestRadio" class="guestRadio"><h2>📻 راديو مجلس سارة</h2><select id="guestStation"><option>MBC FM</option><option>Alif Alif FM</option><option>Panorama FM</option><option>Rotana FM</option><option>Mix FM</option><option>UFM</option><option>Bahrain FM 93.3</option><option>Bahrain Radio 102.3</option></select><div class="actions"><button id="guestRadioPlay" type="button">▶ تشغيل</button><button id="guestRadioStop" type="button">■ إيقاف</button></div><label>الصوت <input id="guestVolume" type="range" min="0" max="100" value="60"></label><p id="guestRadioStatus">اختر المحطة واضغط تشغيل</p><audio id="guestAudio" playsinline></audio></section><p class="foot">🎮 تقدر تلعب أو تتفرج — بدون دخول محادثات المجلس</p></section></main><script src="/socket.io/socket.io.js"></script><script src="/guest.js?v=4"></script><script>document.getElementById('showSalon').onclick=()=>location.href='/salon.html#name='+encodeURIComponent(document.getElementById('guestName').value.trim())</script></body></html>
