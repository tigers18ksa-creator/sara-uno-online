<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>بولينق | مجلس سارة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#42243c,#0c1026 65%);color:#f8df9d;font-family:system-ui,Tahoma;text-align:center;min-height:100dvh}header{padding:12px;font-weight:900;font-size:clamp(18px,4vw,28px)}.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:5px auto 12px}.stats span{background:#171c35;border:1px solid #bd914c;border-radius:15px;padding:8px 16px}canvas{display:block;margin:auto;width:min(96vw,600px);height:min(64vh,680px);border:5px solid #b78d50;border-radius:20px;touch-action:none;background:#171827;box-shadow:0 12px 30px #0008}.controls{max-width:580px;margin:12px auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}button{background:linear-gradient(#f8d58c,#b88035);border:0;border-radius:13px;padding:12px 20px;font-size:17px;font-weight:800;color:#25142a}button:disabled{opacity:.5}input{accent-color:#f2c270;width:120px}p{margin:8px 12px;color:#eee}#status{min-height:27px;font-weight:800}</style></head><body><header>🎳 بولينق — مجلس سارة 👑</header><div class="stats"><span id="round">الجولة 1 / 10</span><span id="throw">الرمية 1 / 2</span><span id="score">النقاط: 0</span></div><canvas id="lane" width="600" height="700"></canvas><div class="controls"><label>قوة الرمية <input id="power" type="range" min="30" max="100" value="75"></label><button id="roll">🎳 ارمِ الكرة</button><button id="restart">إعادة اللعب</button></div><p>حرّك الكرة يمين ويسار بالسحب على الطاولة، ثم اضغط ارمِ الكرة.</p><p id="status">جهّز رميتك!</p><script>
const cv=document.getElementById('lane'),ctx=cv.getContext('2d'),roll=document.getElementById('roll'),status=document.getElementById('status'),power=document.getElementById('power');let round=1,shot=1,total=0,ballX=300,playing=false,pins=[],frameScores=[];const pinPos=[[300,132],[279,111],[321,111],[258,90],[300,90],[342,90],[237,69],[279,69],[321,69],[363,69]];function resetPins(){pins=pinPos.map(([x,y])=>({x,y,up:true}))}function draw(ballY=600){ctx.clearRect(0,0,600,700);let g=ctx.createLinearGradient(0,0,600,0);g.addColorStop(0,'#85502d');g.addColorStop(.13,'#dbab6c');g.addColorStop(.5,'#f8dba0');g.addColorStop(.87,'#dbab6c');g.addColorStop(1,'#85502d');ctx.fillStyle=g;ctx.fillRect(0,0,600,700);ctx.fillStyle='#4b2432';ctx.fillRect(0,0,75,700);ctx.fillRect(525,0,75,700);ctx.strokeStyle='#ac7744';ctx.lineWidth=3;for(let x=130;x<=470;x+=68){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,700);ctx.stroke()}for(let p of pins){if(!p.up)continue;ctx.fillStyle='#f5f4ed';ctx.beginPath();ctx.ellipse(p.x,p.y,12,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d93540';ctx.fillRect(p.x-10,p.y-5,20,5);ctx.strokeStyle='#bbb';ctx.stroke()}let b=ctx.createRadialGradient(ballX-10,ballY-12,2,ballX,ballY,30);b.addColorStop(0,'#b8b9f8');b.addColorStop(.4,'#4442aa');b.addColorStop(1,'#17124b');ctx.fillStyle=b;ctx.beginPath();ctx.arc(ballX,ballY,29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#080a25';for(let [dx,dy] of [[-8,-6],[6,-7],[0,8]]){ctx.beginPath();ctx.arc(ballX+dx,ballY+dy,4,0,Math.PI*2);ctx.fill()}}function update(){document.getElementById('round').textContent='الجولة '+Math.min(round,10)+' / 10';document.getElementById('throw').textContent='الرمية '+shot+' / 2';document.getElementById('score').textContent='النقاط: '+total}function aim(e){if(playing)return;const r=cv.getBoundingClientRect();ballX=Math.max(115,Math.min(485,(e.clientX-r.left)*600/r.width));draw()}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);aim(e)});cv.addEventListener('pointermove',e=>{if(e.buttons)aim(e)});function sound(){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),gain=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(140,ac.currentTime);o.frequency.exponentialRampToValueAtTime(55,ac.currentTime+.25);gain.gain.setValueAtTime(.12,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(gain);gain.connect(ac.destination);o.start();o.stop(ac.currentTime+.31)}catch{}}roll.onclick=()=>{if(playing||round>10)return;playing=true;roll.disabled=true;const start=performance.now(),sx=ballX,strength=+power.value;function step(t){const f=Math.min(1,(t-start)/(1500-strength*7));const y=600-480*f;draw(y);if(f<1)requestAnimationFrame(step);else{let knocked=0;for(let p of pins){if(p.up&&Math.abs(p.x-sx)<(26+strength*.55)){p.up=false;knocked++}}total+=knocked;sound();if(shot===1&&knocked===10){status.textContent='سترايك! 🎉 أسقطت كل القوارير';round++;shot=1;resetPins()}else if(shot===1){status.textContent='أسقطت '+knocked+' قوارير — الرمية الثانية';shot=2}else{status.textContent=pins.every(p=>!p.up)?'سبير! 🎉':'أسقطت '+knocked+' قوارير';round++;shot=1;resetPins()}if(round>10){status.textContent='انتهت اللعبة! مجموعك '+total+' نقطة 🏆';roll.disabled=true}else roll.disabled=false;playing=false;update();draw()}}requestAnimationFrame(step)};document.getElementById('restart').onclick=()=>{round=1;shot=1;total=0;ballX=300;playing=false;roll.disabled=false;resetPins();update();draw();status.textContent='جهّز رميتك!'};resetPins();update();draw();
</script></body></html>
