<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>فك الحصار | مجلس سارة</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#382747,#141320 70%);color:#fff;font-family:system-ui,Tahoma,Arial;overscroll-behavior:none}main{max-width:490px;margin:auto;padding:8px 12px calc(7px + env(safe-area-inset-bottom));height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-evenly;text-align:center;touch-action:pan-x}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(17px,3.5dvh,25px);margin:3px 0;color:#ffe1a0}.btn{background:#ffffff18;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:11px 14px;font:700 14px system-ui;cursor:pointer}.gold{background:linear-gradient(#ffe49c,#d29a40);color:#37220c;border:0}.stats{display:flex;gap:9px;margin:5px 0}.stat{flex:1;background:#ffffff13;border:1px solid #ffffff18;border-radius:12px;padding:10px}.stat strong{display:block;font-size:22px;color:#ffe3a6}.stat small{color:#e5d4e8}.frame{padding:7px;width:min(100%,max(100px,calc(100dvh - 285px)));margin-inline:auto;border-radius:18px;background:linear-gradient(135deg,#a46c37,#5a2f18,#d9a15c);box-shadow:0 14px 35px #0006}.board{position:relative;width:100%;aspect-ratio:1;background:repeating-linear-gradient(90deg,#b7834d 0px,#e9c28b 6px,#d6a96f 15px,#edc998 24px,#c38c53 39px,#dfb67f 51px),linear-gradient(#e5ba7c,#b57b42);box-shadow:inset 0 7px 18px #63360e75,inset 0 -5px 14px #fff6;border-radius:7px;touch-action:none;overflow:hidden}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / 6 - 1px),#8c592b55 calc(100% / 6 - 1px),#8c592b55 calc(100% / 6)),repeating-linear-gradient(0deg,transparent 0,transparent calc(100% / 6 - 1px),#8c592b55 calc(100% / 6 - 1px),#8c592b55 calc(100% / 6));pointer-events:none}.piece{position:absolute;border-radius:8px;border:2px solid #70401d;box-shadow:inset 0 3px 2px #fff8,inset 3px 0 3px #fff5,inset 0 -8px 6px #40220b77,0 5px 0 #5b3218,0 8px 8px #0007;display:grid;place-items:center;touch-action:none;user-select:none;cursor:grab;font-size:21px;font-weight:900;transition:left .1s,top .1s}.piece.red{background:repeating-linear-gradient(93deg,#a63824 0px,#d65435 9px,#b83b26 18px,#e16a42 27px);border-color:#70241a;color:#fff6df;text-shadow:0 2px 3px #511}.exit{position:absolute;right:0;top:33.333%;height:16.667%;width:7px;background:#35c87b;box-shadow:0 0 12px #35c87b;pointer-events:none}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:5px 0}.note{color:#e6d9e5;font-size:clamp(10px,1.6dvh,14px);line-height:1.35}.win{background:#174b36;border:1px solid #53c891;border-radius:13px;padding:15px;margin:14px 0}.hidden{display:none}#toast{min-height:25px;color:#ffe3a6;font-weight:600}button:focus-visible{outline:3px solid #ffdb88}
@media(max-height:650px){.stat{padding:4px}.stat strong{font-size:17px}.btn{padding:7px 10px}.win{padding:7px;margin:4px 0}#toast{min-height:15px}.frame{width:min(100%,max(100px,calc(100dvh - 245px)))}} .piece{will-change:transform}.piece:active{filter:brightness(1.14);transform:scale(1.025)}.win{animation:celebrate .5s ease-out}@keyframes celebrate{0%{transform:scale(.82);opacity:.3}65%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}#toast{transition:opacity .2s} </style></head><body><main><header><button class="btn" onclick="location.href='/'">↩ ردهة الألعاب</button><span>مجلس سارة ✨</span></header><h1>🧩 فك الحصار</h1><div class="note">حرّك القطع وافتح طريق القطعة الحمراء للخروج من اليمين</div><div class="stats"><div class="stat"><small>المستوى</small><strong id="level">1</strong></div><div class="stat"><small>الحركات</small><strong id="moves">0</strong></div><div class="stat"><small>المكتمل</small><strong id="done">0</strong></div></div><div class="frame"><div class="board" id="board"><div class="exit"></div></div></div><div id="toast" aria-live="polite"></div><button class="btn" id="sound" style="align-self:center;padding:7px 12px">🔊 الأصوات مفعّلة</button><div id="win" class="win hidden">🎉 كفو! فكيت الحصار وفتحت الطريق!<div style="margin-top:10px"><button class="btn gold" id="next">المستوى التالي ←</button></div></div><div class="actions"><button class="btn" id="reset">↻ إعادة المستوى</button><button class="btn" id="hint">💡 تلميح</button></div><div class="note">الأفقية تتحرك يمين ويسار، والعمودية فوق وتحت. تقدمك ينحفظ تلقائياً على هذا الجهاز وتكمل من آخر مستوى وصلت له.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),board=$('board'),colors=['#c18a50','#a86c35','#d9a56a','#98602f','#c99b61','#ae7945','#e1b779','#9d6a39'];let level=1,moves=0,pieces=[],won=false,drag=null,soundOn=true,audioCtx=null;function audio(){if(!soundOn)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}function tone(freq,duration,type='sine',gain=.06,delay=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.02)}function woodSound(){const c=audio();if(!c)return;const len=Math.floor(c.sampleRate*.13),buffer=c.createBuffer(1,len,c.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<len;i++){const t=i/c.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*44)*.42+Math.sin(2*Math.PI*165*t)*Math.exp(-t*34)*.17}const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();filter.type='lowpass';filter.frequency.value=1100;gain.gain.value=.3;src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(c.destination);src.start()}function winSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.26,'triangle',.065,i*.13));try{if(navigator.vibrate)navigator.vibrate([50,35,80])}catch{}}$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 الأصوات مفعّلة':'🔇 تشغيل الأصوات';if(soundOn)tone(660,.12)};const name=(()=>{try{return (localStorage.getItem('saraName')||localStorage.getItem('saraUserName')||localStorage.getItem('saraUsername')||'guest').slice(0,40)}catch{return 'guest'}})();const key='sara-unblock-v1:'+name;let progress={level:1,done:0};try{const p=JSON.parse(localStorage.getItem(key)||'{}');if(Number.isInteger(p.level)&&p.level>=1&&p.level<=100)progress.level=p.level;if(Number.isInteger(p.done))progress.done=p.done}catch{};function save(){try{localStorage.setItem(key,JSON.stringify(progress))}catch{}}function rng(seed){let a=seed>>>0;return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}function free(p,x,y){if(x<0||y<0||x+p.w>6||y+p.h>6)return false;return !pieces.some(q=>q!==p&&x<q.x+q.w&&x+p.w>q.x&&y<q.y+q.h&&y+p.h>q.y)}function generate(n){const random=rng(n*9173+821);pieces=[{id:'R',x:4,y:2,w:2,h:1}, {id:'A',x:0,y:0,w:1,h:2},{id:'B',x:1,y:0,w:1,h:2},{id:'C',x:2,y:0,w:1,h:2},{id:'D',x:3,y:0,w:1,h:2},{id:'E',x:0,y:3,w:2,h:1},{id:'F',x:2,y:4,w:2,h:1},{id:'G',x:4,y:4,w:1,h:2},{id:'H',x:5,y:4,w:1,h:2},{id:'I',x:4,y:0,w:1,h:2},{id:'J',x:5,y:0,w:1,h:2},{id:'K',x:0,y:5,w:3,h:1}];for(let i=0;i<180+n*4;i++){const p=pieces[Math.floor(random()*pieces.length)],dir=random()<.5?-1:1,nx=p.x+(p.w>1?dir:0),ny=p.y+(p.h>1?dir:0);if(free(p,nx,ny)){p.x=nx;p.y=ny}}// Preserve a reachable puzzle: every scramble move is reversible.
if(pieces[0].x===4){for(let x=3;x>=0;x--){if(free(pieces[0],x,2))pieces[0].x=x;else break}}}
function solveHint(){const start=pieces.map(p=>p.w>1?p.x:p.y),encode=a=>a.join(','),seen=new Set([encode(start)]),queue=[{a:start,first:null}],max=35000;for(let head=0;head<queue.length&&head<max;head++){const node=queue[head],a=node.a;if(a[0]===4&&head>0)return node.first;for(let i=0;i<pieces.length;i++){const p=pieces[i],horizontal=p.w>1;for(const dir of [-1,1]){for(let step=1;step<=5;step++){const next=a.slice();next[i]+=dir*step;const x=horizontal?next[i]:p.x,y=horizontal?p.y:next[i];if(x<0||y<0||x+p.w>6||y+p.h>6)break;let blocked=false;for(let j=0;j<pieces.length;j++){if(i===j)continue;const q=pieces[j],qx=q.w>1?a[j]:q.x,qy=q.w>1?q.y:a[j];if(x<qx+q.w&&x+p.w>qx&&y<qy+q.h&&y+p.h>qy){blocked=true;break}}if(blocked)break;const key=encode(next);if(seen.has(key))continue;seen.add(key);queue.push({a:next,first:node.first||{id:p.id,dir,step}})}}}}return null}
function render(){board.querySelectorAll('.piece').forEach(el=>el.remove());for(let i=0;i<pieces.length;i++){const p=pieces[i],el=document.createElement('div');el.className='piece'+(p.id==='R'?' red':'');el.style.cssText='left:'+(p.x/6*100)+'%;top:'+(p.y/6*100)+'%;width:'+(p.w/6*100)+'%;height:'+(p.h/6*100)+'%;'+(i?'background:repeating-linear-gradient(93deg,'+colors[(i-1)%colors.length]+' 0px,color-mix(in srgb,'+colors[(i-1)%colors.length]+' 80%,white) 8px,'+colors[(i-1)%colors.length]+' 17px,color-mix(in srgb,'+colors[(i-1)%colors.length]+' 82%,black) 25px);':'');el.textContent=p.id==='R'?'➜':'';el.addEventListener('pointerdown',ev=>{if(won)return;ev.preventDefault();drag={id:p.id,px:ev.clientX,py:ev.clientY,x:p.x,y:p.y};el.setPointerCapture(ev.pointerId)});el.addEventListener('pointerup',ev=>{if(!drag||drag.id!==p.id)return;const step=(p.w>1?ev.clientX-drag.px:ev.clientY-drag.py)/(board.clientWidth/6),count=Math.round(step),sign=Math.sign(count);let x=drag.x,y=drag.y;for(let j=0;j<Math.abs(count);j++){const nx=x+(p.w>1?sign:0),ny=y+(p.h>1?sign:0);if(!free(p,nx,ny))break;x=nx;y=ny}drag=null;if(x!==p.x||y!==p.y){p.x=x;p.y=y;moves++;$('moves').textContent=moves;woodSound();render();if(p.id==='R'&&p.x===4){won=true;winSound();progress.done=Math.max(progress.done,level);progress.level=Math.min(100,level+1);save();$('done').textContent=progress.done;$('win').classList.remove('hidden');$('toast').textContent='✨ أنجزت المستوى '+level+'!'}}});el.addEventListener('pointercancel',()=>{drag=null});board.appendChild(el)}}function start(n){level=Math.max(1,Math.min(100,n));moves=0;won=false;generate(level);$('level').textContent=level;$('moves').textContent='0';$('done').textContent=progress.done;$('win').classList.add('hidden');$('toast').textContent='';render()}$('reset').onclick=()=>{tone(350,.09);start(level)};$('hint').onclick=()=>{tone(780,.13);const h=solveHint();$('toast').textContent=h?'💡 حرّك القطعة '+(h.id==='R'?'الحمراء':h.id)+' '+(h.dir>0?'باتجاه اليمين أو الأسفل':'باتجاه اليسار أو الأعلى')+' بمقدار '+h.step+' خانة':'💡 جرّب تحرير القطع المحيطة بالحمراء أولاً.'};$('next').onclick=()=>{if(level===100){$('toast').textContent='🏆 أنهيت جميع المستويات!';return}tone(880,.15);start(progress.level)};start(progress.level)})();
</script></body></html>
