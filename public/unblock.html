<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>فك الحصار | مجلس سارة</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#382747,#141320 70%);color:#fff;font-family:system-ui,Tahoma,Arial;overscroll-behavior:none}main{max-width:490px;margin:auto;padding:15px 14px 25px;text-align:center}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:25px;margin:9px 0;color:#ffe1a0}.btn{background:#ffffff18;color:#fff;border:1px solid #ffffff35;border-radius:12px;padding:11px 14px;font:700 14px system-ui;cursor:pointer}.gold{background:linear-gradient(#ffe49c,#d29a40);color:#37220c;border:0}.stats{display:flex;gap:9px;margin:15px 0}.stat{flex:1;background:#ffffff13;border:1px solid #ffffff18;border-radius:12px;padding:10px}.stat strong{display:block;font-size:22px;color:#ffe3a6}.stat small{color:#e5d4e8}.frame{padding:9px;border-radius:18px;background:linear-gradient(135deg,#a46c37,#5a2f18,#d9a15c);box-shadow:0 14px 35px #0006}.board{position:relative;width:100%;aspect-ratio:1;background:repeating-linear-gradient(0deg,#e7c48e 0,#e7c48e calc(100% / 6 - 1px),#cba16b calc(100% / 6 - 1px),#cba16b calc(100% / 6));border-radius:7px;touch-action:none;overflow:hidden}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / 6 - 1px),#b48a5a calc(100% / 6 - 1px),#b48a5a calc(100% / 6));pointer-events:none}.piece{position:absolute;border-radius:9px;border:2px solid #0003;box-shadow:inset 0 3px 4px #fff8,inset 0 -5px 5px #0003,0 3px 5px #0004;display:grid;place-items:center;touch-action:none;user-select:none;cursor:grab;font-size:21px;font-weight:900;transition:left .1s,top .1s}.piece.red{background:linear-gradient(#ff7770,#be2824);color:#fff}.exit{position:absolute;right:0;top:33.333%;height:16.667%;width:7px;background:#35c87b;box-shadow:0 0 12px #35c87b;pointer-events:none}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0}.note{color:#e6d9e5;font-size:14px;line-height:1.7}.win{background:#174b36;border:1px solid #53c891;border-radius:13px;padding:15px;margin:14px 0}.hidden{display:none}#toast{min-height:25px;color:#ffe3a6;font-weight:600}button:focus-visible{outline:3px solid #ffdb88}
</style></head><body><main><header><button class="btn" onclick="location.href='/'">↩ ردهة الألعاب</button><span>مجلس سارة ✨</span></header><h1>🧩 فك الحصار</h1><div class="note">حرّك القطع وافتح طريق القطعة الحمراء للخروج من اليمين</div><div class="stats"><div class="stat"><small>المستوى</small><strong id="level">1</strong></div><div class="stat"><small>الحركات</small><strong id="moves">0</strong></div><div class="stat"><small>المكتمل</small><strong id="done">0</strong></div></div><div class="frame"><div class="board" id="board"><div class="exit"></div></div></div><div id="toast" aria-live="polite"></div><div id="win" class="win hidden">🎉 كفو! فكيت الحصار وفتحت الطريق!<div style="margin-top:10px"><button class="btn gold" id="next">المستوى التالي ←</button></div></div><div class="actions"><button class="btn" id="reset">↻ إعادة المستوى</button><button class="btn" id="hint">💡 تلميح</button></div><div class="note">الأفقية تتحرك يمين ويسار، والعمودية فوق وتحت. تقدمك ينحفظ تلقائياً على هذا الجهاز وتكمل من آخر مستوى وصلت له.</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),board=$('board'),colors=['#7a9dca','#bd8bcb','#66a99c','#dca35d','#a7a36a','#c67f9d','#7299ae','#b3a076'];let level=1,moves=0,pieces=[],won=false,drag=null;const name=(()=>{try{return (localStorage.getItem('saraName')||localStorage.getItem('saraUserName')||localStorage.getItem('saraUsername')||'guest').slice(0,40)}catch{return 'guest'}})();const key='sara-unblock-v1:'+name;let progress={level:1,done:0};try{const p=JSON.parse(localStorage.getItem(key)||'{}');if(Number.isInteger(p.level)&&p.level>=1&&p.level<=100)progress.level=p.level;if(Number.isInteger(p.done))progress.done=p.done}catch{};function save(){try{localStorage.setItem(key,JSON.stringify(progress))}catch{}}function rng(seed){let a=seed>>>0;return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}function free(p,x,y){if(x<0||y<0||x+p.w>6||y+p.h>6)return false;return !pieces.some(q=>q!==p&&x<q.x+q.w&&x+p.w>q.x&&y<q.y+q.h&&y+p.h>q.y)}function generate(n){const random=rng(n*9173+821);pieces=[{id:'R',x:4,y:2,w:2,h:1}, {id:'A',x:0,y:0,w:1,h:2},{id:'B',x:1,y:0,w:1,h:2},{id:'C',x:2,y:0,w:1,h:2},{id:'D',x:3,y:0,w:1,h:2},{id:'E',x:0,y:3,w:2,h:1},{id:'F',x:2,y:4,w:2,h:1},{id:'G',x:4,y:4,w:1,h:2},{id:'H',x:5,y:4,w:1,h:2}];for(let i=0;i<70+n*2;i++){const p=pieces[Math.floor(random()*pieces.length)],dir=random()<.5?-1:1,nx=p.x+(p.w>1?dir:0),ny=p.y+(p.h>1?dir:0);if(free(p,nx,ny)){p.x=nx;p.y=ny}}// Preserve a reachable puzzle: every scramble move is reversible.
if(pieces[0].x===4){for(let x=3;x>=0;x--){if(free(pieces[0],x,2))pieces[0].x=x;else break}}}
function render(){board.querySelectorAll('.piece').forEach(el=>el.remove());for(let i=0;i<pieces.length;i++){const p=pieces[i],el=document.createElement('div');el.className='piece'+(p.id==='R'?' red':'');el.style.cssText='left:'+(p.x/6*100)+'%;top:'+(p.y/6*100)+'%;width:'+(p.w/6*100)+'%;height:'+(p.h/6*100)+'%;'+(i?'background:linear-gradient(155deg,'+colors[(i-1)%colors.length]+',color-mix(in srgb,'+colors[(i-1)%colors.length]+' 68%,black));':'');el.textContent=p.id==='R'?'➜':'';el.addEventListener('pointerdown',ev=>{if(won)return;ev.preventDefault();drag={id:p.id,px:ev.clientX,py:ev.clientY,x:p.x,y:p.y};el.setPointerCapture(ev.pointerId)});el.addEventListener('pointerup',ev=>{if(!drag||drag.id!==p.id)return;const step=(p.w>1?ev.clientX-drag.px:ev.clientY-drag.py)/(board.clientWidth/6),count=Math.round(step),sign=Math.sign(count);let x=drag.x,y=drag.y;for(let j=0;j<Math.abs(count);j++){const nx=x+(p.w>1?sign:0),ny=y+(p.h>1?sign:0);if(!free(p,nx,ny))break;x=nx;y=ny}drag=null;if(x!==p.x||y!==p.y){p.x=x;p.y=y;moves++;$('moves').textContent=moves;render();if(p.id==='R'&&p.x===4){won=true;progress.done=Math.max(progress.done,level);progress.level=Math.min(100,level+1);save();$('done').textContent=progress.done;$('win').classList.remove('hidden');$('toast').textContent='✨ أنجزت المستوى '+level+'!'}}});el.addEventListener('pointercancel',()=>{drag=null});board.appendChild(el)}}function start(n){level=Math.max(1,Math.min(100,n));moves=0;won=false;generate(level);$('level').textContent=level;$('moves').textContent='0';$('done').textContent=progress.done;$('win').classList.add('hidden');$('toast').textContent='';render()}$('reset').onclick=()=>start(level);$('hint').onclick=()=>{$('toast').textContent='💡 أبعد القطع التي تسد صف القطعة الحمراء، وابدأ بالعمودية.'};$('next').onclick=()=>{if(level===100){$('toast').textContent='🏆 أنهيت جميع المستويات!';return}start(progress.level)};start(progress.level)})();
</script></body></html>
