<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>مغامرات المزرعة | مجلس سارة</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#152b1a;font-family:system-ui,Tahoma,sans-serif;color:#fff}body{display:flex;justify-content:center}main{width:min(100%,530px);height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 5px) 8px calc(env(safe-area-inset-bottom) + 6px);gap:5px;background:linear-gradient(#3a6636,#1d3523)}header{display:flex;justify-content:space-between;align-items:center;gap:5px;font-weight:900;font-size:17px}button{border:1px solid #e8c583;background:linear-gradient(#e4b974,#9d632f);color:#27190b;border-radius:11px;padding:9px;font-weight:900;font-family:inherit;touch-action:manipulation;cursor:pointer}header button{font-size:12px;padding:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}.stats span{background:#213d28;border:1px solid #9cba7c;border-radius:9px;padding:5px 2px;text-align:center}#scene{flex:1;min-height:0;position:relative;overflow:hidden;border:6px ridge #a46e39;border-radius:16px;background:#80b55c;touch-action:none;box-shadow:0 8px 25px #07170b99}canvas{display:block;width:100%;height:100%;touch-action:none}#message{position:absolute;left:8px;right:8px;top:9px;text-align:center;background:#1b3024d9;border:1px solid #d6b978;border-radius:11px;padding:7px;font-size:12px;font-weight:800;pointer-events:none}#joy{position:absolute;bottom:12px;left:12px;width:90px;height:90px;border-radius:50%;background:#f4e3b433;border:3px solid #fff9;display:grid;place-items:center;pointer-events:none}#nub{width:37px;height:37px;border-radius:50%;background:#f8d58b;border:3px solid #fff8;box-shadow:0 3px 10px #0006}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.actions button{min-height:52px;padding:5px 2px;font-size:12px}.actions button b{display:block;font-size:21px}.bottom{font-size:11px;text-align:center;color:#d7edc8}.overlay{position:absolute;inset:0;background:#142819e9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:4}.overlay h2{margin:0;color:#ffe09e}.overlay p{line-height:1.7}.hidden{display:none}#sound{background:#28583a;color:#fff;border-color:#6a9e70}</style></head><body><main><header><button onclick="location.href='/'">↩ ردهة الألعاب</button><span>🌾 مغامرات المزرعة</span><button id="sound">🔊</button></header><div class="stats"><span>🏆 يوم <b id="day">1</b></span><span>❤️ <b id="hp">100</b></span><span>🌽 <b id="corn">3</b></span><span>🍲 <b id="food">1</b></span></div><div id="scene"><canvas id="game"></canvas><div id="message">اسحب داخل المزرعة لتحريك المزارع. ازرع واحصد واطبخ ودافع!</div><div id="joy"><div id="nub"></div></div><div id="overlay" class="overlay hidden"><h2 id="endTitle"></h2><p id="endText"></p><button id="restart">🔁 العب من جديد</button></div></div><div class="actions"><button id="plant"><b>🌱</b>ازرع</button><button id="harvest"><b>🌽</b>احصد</button><button id="cook"><b>🍲</b>اطبخ</button><button id="defend"><b>🛡️</b>دافع</button></div><div class="bottom">تحكم بالسحب • احمِ البيت من الجهات الأربع • تقدمك ينحفظ تلقائيًا</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),scene=$('scene');let W=360,H=520,now=0,last=0,dir={x:0,y:0},pointer=null,muted=false,ac=null,ended=false,flash=0,attack=0;const key='sara-farm-adventure-v1:'+(localStorage.getItem('saraName')||localStorage.getItem('saraUserName')||localStorage.getItem('saraUsername')||'guest');let save={};try{save=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let day=Math.max(1,save.day||1),hp=100,corn=3,food=1,kills=0,plots=[],enemies=[],particles=[],player={x:.5,y:.56},wave=0,spawn=0,phase=0;function persist(){try{localStorage.setItem(key,JSON.stringify({day}))}catch{}}function sound(f=280,t=.1){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch{}}function toast(t){$('message').textContent=t}function stats(){$('day').textContent=day;$('hp').textContent=Math.ceil(hp);$('corn').textContent=corn;$('food').textContent=food}function resize(){const b=scene.getBoundingClientRect();W=Math.max(200,b.width-12);H=Math.max(250,b.height-12);const d=Math.min(2,devicePixelRatio||1);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();const beds=[{x:.22,y:.27},{x:.42,y:.27},{x:.62,y:.27},{x:.22,y:.42},{x:.42,y:.42},{x:.62,y:.42},{x:.22,y:.57},{x:.42,y:.57},{x:.62,y:.57}];plots=beds.map((p,i)=>({...p,growth:i<3?1:0,age:0}));function near(p,dist=.13){return Math.hypot(player.x-p.x,player.y-p.y)<dist}function sparkle(x,y,emoji){particles.push({x,y,emoji,life:1})}function action(type){if(ended)return;const plot=plots.find(p=>near(p,.15)&&(type==='plant'?p.growth===0:p.growth===2));if(type==='plant'){if(!plot){toast('🌱 قرب من أرض فاضية عشان تزرع');return}plot.growth=1;plot.age=0;sound(480);sparkle(plot.x,plot.y,'🌱');toast('زرعت البذور! انتظر لين ينضج المحصول')}if(type==='harvest'){if(!plot){toast('🌽 قرب من زرع ناضج عشان تحصده');return}plot.growth=0;corn+=2;sound(700);sparkle(plot.x,plot.y,'🌽');toast('كفو! حصّلت حبتين ذرة')}if(type==='cook'){if(Math.hypot(player.x-.83,player.y-.72)>.18){toast('🍳 روح عند مطبخ المزرعة أول');return}if(corn<2){toast('تحتاج حبتين ذرة للطبخ');return}corn-=2;food++;hp=Math.min(100,hp+12);sound(630);sparkle(.83,.72,'🍲');toast('طبخت وجبة! زاد مخزون الأكل وصحتك')}if(type==='defend'){attack=.25;const target=enemies.filter(e=>Math.hypot(player.x-e.x,player.y-e.y)<.19);if(!target.length){toast('🛡️ اقترب من المهاجم واضغط دافع');sound(190);return}target.forEach(e=>{e.hp--;sparkle(e.x,e.y,'💥');if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);kills++}});sound(160);toast('💥 صدّيت الهجوم!')}stats()}['plant','harvest','cook','defend'].forEach(k=>$(k).onclick=()=>action(k));$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};function setJoy(x,y){const box=scene.getBoundingClientRect(),dx=x-(box.left+60),dy=y-(box.bottom-60),length=Math.hypot(dx,dy)||1,scale=Math.min(1,45/length);dir={x:dx/length*scale,y:dy/length*scale};$('nub').style.transform='translate('+(dir.x*25)+'px,'+(dir.y*25)+'px)'}scene.addEventListener('pointerdown',e=>{if(ended)return;e.preventDefault();pointer=e.pointerId;scene.setPointerCapture(pointer);setJoy(e.clientX,e.clientY);sound(360,.04)});scene.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e.clientX,e.clientY)});function stop(e){if(e.pointerId===pointer){pointer=null;dir={x:0,y:0};$('nub').style.transform=''}}scene.addEventListener('pointerup',stop);scene.addEventListener('pointercancel',stop);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();dir={x:Number(e.key==='ArrowRight'||e.key==='d')-Number(e.key==='ArrowLeft'||e.key==='a'),y:Number(e.key==='ArrowDown'||e.key==='s')-Number(e.key==='ArrowUp'||e.key==='w')}}});window.addEventListener('keyup',()=>{if(pointer===null)dir={x:0,y:0}});function round(x,y,w,h,color,r=8){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function text(t,x,y,size=25){ctx.font=size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}function draw(){ctx.clearRect(0,0,W,H);const grass=ctx.createLinearGradient(0,0,W,H);grass.addColorStop(0,'#92c966');grass.addColorStop(1,'#549543');ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);for(let i=0;i<42;i++){const x=((i*73+31)%397)/397*W,y=((i*113+27)%503)/503*H;text(i%4===0?'🌼':'🌿',x,y,10)}round(.05*W,.08*H,.9*W,.84*H,'#6b4a27',12);round(.065*W,.09*H,.87*W,.82*H,'#b48a58',9);for(let j=0;j<8;j++){round(.065*W,(.09+j*.115)*H,.87*W,2,'#996b3c',0)}round(.08*W,.14*H,.73*W,.52*H,'#a1774a',8);round(.09*W,.15*H,.71*W,.5*H,'#c49a62',8);for(const p of plots){const x=p.x*W,y=p.y*H;round(x-18,y-14,36,28,'#80512e',5);round(x-15,y-11,30,22,'#9b6539',4);if(p.growth)text(p.growth===2?'🌽':'🌱',x,y,25)}round(.73*W,.64*H,.22*W,.18*H,'#b46a32',9);text('🏠',.83*W,.68*H,Math.min(65,W*.15));text('🍳',.83*W,.77*H,27);round(.72*W,.09*H,.22*W,.14*H,'#c88845',8);text('🏚️',.83*W,.15*H,42);text('🚪',.5*W,.89*H,34);for(const e of enemies){text(e.icon,e.x*W,e.y*H,29);ctx.fillStyle='#e24b3b';ctx.fillRect(e.x*W-13,e.y*H-21,26*(e.hp/(day>3?2:1)),3)}ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(player.x*W,player.y*H+16,15,6,0,0,Math.PI*2);ctx.fill();text('👨‍🌾',player.x*W,player.y*H,37);if(attack>0){ctx.strokeStyle='#fff5a6';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x*W,player.y*H,W*.18,0,Math.PI*2);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);text(p.emoji,p.x*W,(p.y-(1-p.life)*.07)*H,25);ctx.globalAlpha=1}ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff4cc';ctx.fillText('مطبخ',.83*W,.85*H)}function enemy(){const side=Math.floor(Math.random()*4),x=side===0?0:side===1?1:Math.random(),y=side===2?0:side===3?1:Math.random();enemies.push({x,y,hp:day>3?2:1,speed:.027+day*.002,icon:Math.random()<.5?'🐺':'🦊',hit:0})}function finish(win){ended=true;$('overlay').classList.remove('hidden');$('endTitle').textContent=win?'🎉 نجحت بحماية المزرعة!':'💔 المزرعة تعرضت للهجوم';$('endText').textContent=win?'وصلت لليوم '+day+'! جاهز لتحدي أصعب؟':'حاول تزرع وتطبخ وتدافع بسرعة أكبر';$('restart').textContent=win?'🌾 اليوم التالي':'🔁 إعادة المحاولة';$('restart').onclick=()=>{if(win){day++;persist()}reset()};sound(win?880:140,.4)}function reset(){hp=100;corn=3;food=1;kills=0;wave=0;spawn=0;phase=0;ended=false;player={x:.5,y:.56};enemies=[];plots=beds.map((p,i)=>({...p,growth:i<3?1:0,age:0}));$('overlay').classList.add('hidden');toast('🌾 ازرع واحصد واطبخ، وامنع الحيوانات من الوصول للبيت!');stats()}function tick(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!ended){now+=dt;phase+=dt;player.x=Math.max(.09,Math.min(.92,player.x+dir.x*dt*.42));player.y=Math.max(.11,Math.min(.88,player.y+dir.y*dt*.42));for(const p of plots){if(p.growth===1){p.age+=dt;if(p.age>5+day*.25)p.growth=2}}spawn+=dt;if(spawn>Math.max(1.9,5.5-day*.25)){spawn=0;if(wave<5+day*2){enemy();wave++;toast('⚠️ هجوم من أطراف المزرعة! دافع عن البيت')}}for(const e of enemies){const dx=.83-e.x,dy=.69-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*dt*e.speed;e.y+=dy/d*dt*e.speed;if(d<.09){hp-=dt*(9+day*2);e.hit+=dt;if(e.hit>2){e.hit=0;hp-=5}}}if(hp<=0)finish(false);if(wave>=5+day*2&&enemies.length===0&&phase>10)finish(true);if(attack>0)attack-=dt;particles=particles.filter(p=>(p.life-=dt*1.5)>0);stats()}draw();requestAnimationFrame(tick)}reset();requestAnimationFrame(tick)})();
</script></body></html>
