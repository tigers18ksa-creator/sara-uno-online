<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألعاب مجلس سارة</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#39223e,#100b16 70%);font:16px Tahoma,Arial;color:#fff0d5;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#130c17bd;border-bottom:1px solid #ab8248}h1{margin:0;color:#f8d18a;font-size:clamp(22px,4vw,36px)}button,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #9c754b}button{cursor:pointer;background:linear-gradient(#6b365f,#351c43);color:#fff0d5}button:hover{filter:brightness(1.2)}button:disabled{opacity:.4;cursor:not-allowed}.gold{background:linear-gradient(#d5ac65,#a46d31);color:#201320;font-weight:bold}.shell{max-width:1150px;margin:auto;padding:22px}.games,.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.tile,.room,.panel{border:1px solid #a77d46;background:linear-gradient(145deg,#241528,#120f1a);border-radius:18px;padding:20px;box-shadow:0 12px 30px #0007}.tile{text-align:center}.tile .emoji{font-size:58px}.tile h2{color:#f4cb8b}.room{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#bba8b6}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}input{background:#19121f;color:white;min-width:0}#board{min-height:300px}.dominoTable{background:radial-gradient(#5e1938,#341225);border:10px ridge #9b6435;border-radius:25px;padding:24px;min-height:200px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.piece{background:#f2e2c2;color:#251c1a;border:2px solid #d0b889;box-shadow:0 4px 5px #0008;border-radius:7px;padding:10px;font-size:23px;min-width:60px}.hand{display:flex;gap:8px;flex-wrap:wrap;padding:16px}.hand button{background:#e9dbbd;color:#221624}.poolTable{position:relative;background:radial-gradient(ellipse,#0e744e,#06402f);border:20px ridge #73401d;border-radius:35px;width:100%;aspect-ratio:2/1;max-height:540px;box-shadow:inset 0 0 40px #0008}.ball{position:absolute;width:4.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #fff5;box-shadow:inset -5px -6px 8px #0008,1px 2px 3px #0007;color:#111;text-align:center;font-weight:bold;font-size:clamp(9px,1.5vw,16px);display:grid;place-items:center;background:#f5f1e8}.ball[data-n="8"]{background:#111;color:white}.ball.solid{background:#e3aa2e}.ball.stripe{background:linear-gradient(#f5f1e8 20%,#d44d38 21%,#d44d38 75%,#f5f1e8 76%)}.pocket{position:absolute;width:5%;aspect-ratio:1;background:#080909;border-radius:50%;transform:translate(-50%,-50%)}.cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:20px}.card{background:#fff9e7;color:#17171d;font-size:25px;min-width:58px;min-height:88px;border-radius:8px;box-shadow:0 5px 7px #0008}.red{color:#c82e37}.info{padding:12px;background:#120b16;border-radius:12px;margin:12px 0}.slider{accent-color:#d8aa6b}#game{margin-top:12px}#notice{position:fixed;bottom:20px;right:20px;background:#432340;padding:12px;border-radius:10px;display:none}@media(max-width:650px){.shell{padding:12px}.tile{padding:12px}.poolTable{border-width:10px}.card{min-width:43px;min-height:67px;font-size:18px}.piece{min-width:46px;font-size:17px}}

/* Fixed premium game frame with integrated chat and radio */
html,body{height:100%;height:100dvh;overflow:hidden}body{display:flex;flex-direction:column}header{flex:0 0 auto;padding:8px 12px}header h1{font-size:clamp(17px,4vw,27px)}.shell{flex:1;min-height:0;width:100%;overflow:auto;padding:8px 12px}#game:not(.hidden){height:100%;min-height:0;display:flex;flex-direction:column;gap:5px;margin:0;overflow:hidden}#game>.row{flex:0 0 auto;justify-content:space-between}#game>.row button{padding:7px}#game .info{flex:0 0 auto;margin:2px 0;padding:5px 8px;font-size:12px}#game #board{flex:1;min-height:0;overflow:auto;border:5px ridge #b98b43;border-radius:20px;background:radial-gradient(ellipse,#41243e,#180e20);padding:8px}#game #controls{flex:0 0 auto;display:flex;justify-content:center;gap:5px;flex-wrap:wrap}#game #controls button{padding:7px 12px}#game #hand{flex:0 0 auto;min-height:0;max-height:23dvh;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;padding:5px;justify-content:center}#game .card{min-width:clamp(31px,8vw,55px);min-height:clamp(52px,10dvh,80px);padding:5px;font-size:clamp(13px,3vw,21px)}#game .cards{padding:4px}.gameExtras{flex:0 0 auto;display:flex;gap:6px;align-items:center;justify-content:space-between;min-height:35px}.gameExtras button,.gameExtras select{font-size:12px;padding:6px;border-radius:8px}.gameExtras input[type=range]{width:65px}.tableChat{flex:0 0 auto;border:1px solid #ae864b;border-radius:12px;background:#150e1c;padding:5px}.tableChatMessages{height:clamp(36px,8dvh,75px);overflow-y:auto;font-size:12px;line-height:1.5}.tableChat .row{flex-wrap:nowrap;gap:5px}.tableChat input{flex:1;width:0;padding:7px;font-size:13px}.tableChat button{padding:7px 10px;font-size:12px}@media(max-height:680px){#game .info{font-size:11px;padding:2px 5px}#game #hand{max-height:18dvh}#game .card{min-height:43px}.tableChatMessages{height:32px}}
</style></head><body><header><h1>♛ مجلس سارة | صالة الألعاب</h1><button id="sound">🔊 الصوت شغال</button></header><main class="shell"><section id="login" class="panel"><h2>أهلًا بك في صالة الألعاب</h2><p class="muted">ادخل باسمك فقط، العب أو شاهد المباريات مباشرة.</p><div class="row"><input id="name" maxlength="24" placeholder="اسمك في المجلس"><button id="enter" class="gold">دخول الصالة</button></div></section><section id="lobby" class="hidden"><h2>اختر لعبتك</h2><div class="games"><div class="tile"><div class="emoji">🎱</div><h2>بلياردو 8 بول</h2><p>لاعبان — طاولات ومشاهدون</p><button data-kind="pool" class="gold">عرض الطاولات</button></div><div class="tile"><div class="emoji">🁣</div><h2>الدومينو</h2><p>أربعة لاعبين — أحجار ونقاط</p><button data-kind="domino" class="gold">عرض الطاولات</button></div><div class="tile"><div class="emoji">♠️</div><h2>البلوت</h2><p>أربعة لاعبين — صن وحكم</p><button data-kind="baloot" class="gold">عرض الطاولات</button></div></div><section id="rooms" class="hidden"><div class="row"><h2 id="roomTitle"></h2><button id="create" class="gold">＋ إنشاء طاولة</button></div><div id="roomList" class="rooms"></div></section></section><section id="game" class="hidden"><div class="row"><button id="leave">↩ العودة للصالة</button><h2 id="gameTitle"></h2><button id="restart">↻ جولة جديدة</button></div><div class="info" id="status"></div><div class="info" id="spectators"></div><div id="board"></div><div id="controls"></div><div id="hand" class="hand"></div><div class="gameExtras"><label>📻 الراديو <select id="gameStation"><option value="">اختر إذاعة</option><option value="MBC FM">MBC FM</option><option value="Panorama FM">Panorama FM</option><option value="Alif Alif FM">ألف ألف FM</option><option value="Mix FM">Mix FM</option></select></label><button id="gameRadioToggle" type="button">▶ تشغيل</button><label>🔉 <input id="gameVolume" type="range" min="0" max="100" value="35"></label></div><div class="tableChat"><div id="tableChatMessages" class="tableChatMessages" aria-live="polite"></div><form id="tableChatForm" class="row"><input id="tableChatInput" maxlength="400" placeholder="اكتب رسالة للاعبين والمشاهدين"><button type="submit">إرسال</button></form></div></section></main><div id="notice"></div><script src="/socket.io/socket.io.js"></script><script>
const s=io('/premium'),$=id=>document.getElementById(id);let kind='pool',rooms=[],current=null,sound=true,audio=null;const labels={pool:'🎱 بلياردو',domino:'🁣 دومينو',baloot:'♠️ بلوت'};function tone(f=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,audio.currentTime);v.gain.setValueAtTime(.08,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}function alertText(t){$('notice').textContent=t;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2500)}$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 الصوت شغال':'🔇 مكتوم'};const params=new URLSearchParams(location.hash.slice(1));$('name').value=params.get('name')||localStorage.getItem('saraGamesName')||'';$('enter').onclick=()=>s.emit('enter',$('name').value);$('name').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};s.on('entered',name=>{localStorage.setItem('saraGamesName',name);$('login').classList.add('hidden');$('lobby').classList.remove('hidden');if(params.get('game'))showKind(params.get('game'))});s.on('gameError',alertText);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>showKind(b.dataset.kind));function showKind(k){if(!labels[k])return;kind=k;$('rooms').classList.remove('hidden');$('roomTitle').textContent=labels[k]+' — الطاولات';renderRooms();s.emit('list')}s.on('lobby',data=>{rooms=data;renderRooms()});function renderRooms(){const a=rooms.filter(x=>x.kind===kind);$('roomList').replaceChildren();if(!a.length)$('roomList').textContent='ما فيه طاولات حاليًا، افتح أول طاولة!';for(const g of a){const d=document.createElement('div');d.className='room';d.innerHTML='<b>طاولة '+g.id+'</b><span>👥 '+g.players.length+' / '+g.capacity+' — '+g.players.map(x=>x.replace(/[<>]/g,'')).join('، ')+'</span><span>👁 '+g.watchers+' مشاهد — '+(g.status==='playing'?'جارية':'بانتظار لاعبين')+'</span>';const row=document.createElement('div');row.className='actions';for(const [label,watch] of [['انضم للعب',false],['👁 مشاهدة',true]]){const b=document.createElement('button');b.textContent=label;b.disabled=!watch&&g.players.length>=g.capacity;b.onclick=()=>s.emit('join',{id:g.id,watch});row.append(b)}d.append(row);$('roomList').append(d)}}$('create').onclick=()=>s.emit('create',kind);$('leave').onclick=()=>{s.emit('leave');current=null;$('game').classList.add('hidden');$('lobby').classList.remove('hidden')};$('restart').onclick=()=>s.emit('restart');function button(text,fn,disabled=false){const b=document.createElement('button');b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}function move(x){s.emit('move',x);tone(440)}
s.on('gameState',g=>{current=g;$('game').classList.remove('hidden');$('lobby').classList.add('hidden');$('gameTitle').textContent=labels[g.kind]+' — طاولة '+g.id;const mine=g.players.findIndex(p=>p.name===localStorage.getItem('saraGamesName'));const myTurn=mine===g.turn&&g.status==='playing';$('status').textContent=g.players.map((p,i)=>(i===g.turn?'🎯 ':'')+p.name).join(' | ')+' — '+(g.winner?'🏆 '+g.winner:g.log||'بانتظار اللاعبين');$('spectators').textContent='👁 المشاهدون: '+g.watchers+' | '+(mine<0?'أنت تشاهد المباراة':'أنت لاعب');$('restart').disabled=mine<0;$('board').replaceChildren();$('hand').replaceChildren();$('controls').replaceChildren();
if(g.kind==='domino'){const table=document.createElement('div');table.className='dominoTable';for(const p of g.table){const e=document.createElement('span');e.className='piece';e.textContent=p.join('│');table.append(e)}if(!g.table.length)table.textContent='🁣 الطاولة جاهزة';$('board').append(table);for(const t of g.hand){const p=button(t.join('│'),()=>{const side=confirm('تلعب الحجر على اليسار؟ موافق = يسار، إلغاء = يمين')?'left':'right';move({tile:t.join('-'),side})},!myTurn);p.className='piece';$('hand').append(p)}$('controls').append(button('اسحب حجرًا',()=>move({draw:true}),!myTurn))}
if(g.kind==='baloot'){const info=document.createElement('p');info.textContent='فريق 1: '+g.scores[0]+' | فريق 2: '+g.scores[1]+' | '+(g.contract?'العقد: '+(g.contract.type==='sun'?'صن':'حكم '+g.contract.trump):'ورقة الشراء: '+g.upcard?.rank+g.upcard?.suit);$('board').append(info);const trick=document.createElement('div');trick.className='cards';for(const x of g.trick){const p=document.createElement('span');p.className='card '+('♥♦'.includes(x.card.suit)?'red':'');p.textContent=x.card.rank+x.card.suit;trick.append(p)}$('board').append(trick);if(g.phase==='bid'){for(const [label,bid] of [['صن','sun'],['حكم','hokom'],['بس','pass']])$('controls').append(button(label,()=>move({bid}),mine<0||g.players[mine]?.name!==g.players[g.turn]?.name))}for(const c of g.hand){const b=button(c.rank+c.suit,()=>move({card:c.id}),!myTurn||g.phase!=='play');b.className='card '+('♥♦'.includes(c.suit)?'red':'');$('hand').append(b)}}
if(g.kind==='pool'){const t=document.createElement('div');t.className='poolTable';for(const [x,y] of [[0,0],[50,0],[100,0],[0,100],[50,100],[100,100]]){const p=document.createElement('div');p.className='pocket';p.style.left=x+'%';p.style.top=y+'%';t.append(p)}for(const b of g.balls||[]){if(!b.live)continue;const el=document.createElement('div');el.className='ball '+(b.n===0?'':b.n>8?'stripe':'solid');el.dataset.n=b.n;el.style.left=b.x*100+'%';el.style.top=b.y*100+'%';el.textContent=b.n||'';t.append(el)}$('board').append(t);const aim=document.createElement('input');aim.type='range';aim.min='0';aim.max='359';aim.value='0';aim.className='slider';const pow=document.createElement('input');pow.type='range';pow.min='10';pow.max='100';pow.value='65';pow.className='slider';$('controls').append('زاوية التصويب ',aim,' قوة الضربة ',pow,button('🎱 اضرب',()=>move({angle:Number(aim.value)*Math.PI/180,power:Number(pow.value)/100}),!myTurn))}
tone(370)});
const tableChatBox=$('tableChatMessages');$('tableChatForm').onsubmit=e=>{e.preventDefault();const input=$('tableChatInput');if(!current||!input.value.trim())return;s.emit('tableChat',input.value);input.value=''};s.on('tableChat',m=>{const line=document.createElement('div');const who=document.createElement('b');who.textContent=m.name+': ';line.append(who,document.createTextNode(m.message));tableChatBox.append(line);while(tableChatBox.children.length>80)tableChatBox.firstChild.remove();tableChatBox.scrollTop=tableChatBox.scrollHeight});const gameRadio=new Audio();gameRadio.volume=.35;$('gameStation').onchange=()=>{gameRadio.pause();gameRadio.removeAttribute('src');gameRadio.load();$('gameRadioToggle').textContent='▶ تشغيل'};$('gameRadioToggle').onclick=async()=>{if(!$('gameStation').value)return alertText('اختر إذاعة أولاً');if(gameRadio.paused){try{if(!gameRadio.src){const response=await fetch('/api/radio/stations?name='+encodeURIComponent($('gameStation').value));if(!response.ok)throw Error('station');const data=await response.json();const urls=[...(data.streams||[]),...(data.urls||[]),...(data.candidates||[])];const first=urls.find(x=>typeof x==='string')||data.url||data.stream;if(!first)throw Error('no stream');gameRadio.src=first;}await gameRadio.play();$('gameRadioToggle').textContent='⏸ إيقاف'}catch(e){alertText('تعذر تشغيل الإذاعة، جرّب محطة أخرى')}}else{gameRadio.pause();$('gameRadioToggle').textContent='▶ تشغيل'}};$('gameVolume').oninput=e=>gameRadio.volume=Number(e.target.value)/100;
</script></body></html>
